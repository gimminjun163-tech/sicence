<title>과학 단원평가실</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@400;700&family=IBM+Plex+Sans+KR:wght@400;500;600;700&family=Nanum+Pen+Script&display=swap" rel="stylesheet">
<style>
/* Layout: a test paper on a desk — request form + record card; exam sheet + OMR answer card; red-pen grading */
:root{
  --desk:#E2E6EA; --paper:#FCFCFA; --ink:#1B2330; --muted:#5D6775; --rule:#CDD3DA; --rule-strong:#1B2330;
  --omr:#C42F4D; --omr-soft:#F7E0E5; --pen:#D9271C; --ok:#2B7A4B; --chip:#EDF0F3; --focus:#2F5FD0;
  --shadow:0 1px 0 rgba(27,35,48,.06), 0 18px 40px -26px rgba(27,35,48,.45);
  --f-paper:'Gowun Batang','Noto Serif KR','Apple SD Gothic Neo',serif;
  --f-ui:'IBM Plex Sans KR',system-ui,-apple-system,'Apple SD Gothic Neo','Malgun Gothic',sans-serif;
  --f-pen:'Nanum Pen Script','Gowun Batang',cursive;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --desk:#0F1318; --paper:#181D24; --ink:#E4E8EE; --muted:#9AA4B1; --rule:#2D3541; --rule-strong:#C9D0DA;
  --omr:#EE7089; --omr-soft:#3A2029; --pen:#FF5E52; --ok:#5DC98D; --chip:#222933; --focus:#86A6FF;
  --shadow:0 1px 0 rgba(0,0,0,.3), 0 18px 40px -24px rgba(0,0,0,.8); color-scheme:dark}}
:root[data-theme="dark"]{
  --desk:#0F1318; --paper:#181D24; --ink:#E4E8EE; --muted:#9AA4B1; --rule:#2D3541; --rule-strong:#C9D0DA;
  --omr:#EE7089; --omr-soft:#3A2029; --pen:#FF5E52; --ok:#5DC98D; --chip:#222933; --focus:#86A6FF;
  --shadow:0 1px 0 rgba(0,0,0,.3), 0 18px 40px -24px rgba(0,0,0,.8); color-scheme:dark}

*{box-sizing:border-box}
body{background:var(--desk);color:var(--ink);font-family:var(--f-ui);font-size:15px;line-height:1.6;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 96px}
button,input,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
.wrap{max-width:1180px;margin:0 auto}
h1,h2,h3{text-wrap:balance;margin:0}

/* header */
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;padding-block:22px 18px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:12px}
.seal{width:40px;height:40px;border:2px solid var(--omr);color:var(--omr);border-radius:50%;display:grid;place-items:center;
  font-family:var(--f-paper);font-weight:700;font-size:19px;transform:rotate(-8deg)}
.brand h1{font-family:var(--f-paper);font-size:22px;letter-spacing:-.01em}
.brand p{margin:0;color:var(--muted);font-size:13px}
.ghost{background:none;border:1px solid var(--rule);border-radius:8px;padding:7px 12px;font-size:13.5px}
.ghost:hover{border-color:var(--ink)}

/* paper */
.paper{background:var(--paper);box-shadow:var(--shadow);border-radius:3px;min-width:0}
.grid{display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:24px;align-items:start}
@media (max-width:900px){.grid{grid-template-columns:minmax(0,1fr)}}

/* setup form */
.form{padding:28px 32px 32px}
@media (max-width:560px){.form{padding:22px 18px 24px}}
.eyebrow{font-size:12px;letter-spacing:.14em;color:var(--omr);font-weight:600}
.form-head{border-bottom:2px solid var(--rule-strong);padding-bottom:14px;margin-bottom:6px}
.form-head h2{font-family:var(--f-paper);font-size:27px;margin-top:4px}
.step{display:grid;grid-template-columns:30px minmax(0,1fr);gap:14px;padding-block:20px;border-bottom:1px solid var(--rule)}
.step:last-of-type{border-bottom:0}
.step-n{width:26px;height:26px;border-radius:50%;border:1.5px solid var(--ink);display:grid;place-items:center;font-size:13px;font-weight:600;margin-top:2px}
.step h3{font-size:16px;font-weight:600;margin-bottom:10px}
.step .hint{color:var(--muted);font-size:13px;margin:-6px 0 10px}

.seg{display:inline-flex;border:1px solid var(--rule);border-radius:9px;padding:3px;gap:3px;background:var(--chip);flex-wrap:wrap}
.seg button{border:0;background:none;padding:7px 16px;border-radius:7px;font-size:14px;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--paper);color:var(--ink);font-weight:600;box-shadow:0 1px 2px rgba(0,0,0,.12)}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:12px}
.chip{border:1px solid var(--rule);background:none;border-radius:999px;padding:5px 13px;font-size:13.5px;display:inline-flex;gap:6px;align-items:center}
.chip[aria-pressed="true"]{border-color:var(--ink);background:var(--ink);color:var(--paper)}
.chip .cnt{font-size:11.5px;background:var(--omr);color:#fff;border-radius:999px;padding:0 6px;font-weight:600}
.units{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;margin-top:12px}
@media (max-width:620px){.units{grid-template-columns:minmax(0,1fr)}}
.unit{display:flex;gap:10px;align-items:flex-start;border:1px solid var(--rule);border-radius:8px;padding:10px 12px;cursor:pointer;min-width:0}
.unit:hover{border-color:var(--muted)}
.unit input{margin-top:4px;accent-color:var(--omr);flex:none}
.unit b{font-weight:600;font-size:14.5px;display:block}
.unit small{color:var(--muted);font-size:12px;line-height:1.45;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.unit.on{border-color:var(--omr);background:var(--omr-soft)}
.unit-actions{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-top:10px;font-size:13px;color:var(--muted)}
.linkbtn{background:none;border:0;padding:2px 0;color:var(--ink);text-decoration:underline;text-underline-offset:3px;font-size:13px}
.picked{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.pk{font-size:12.5px;border-radius:6px;background:var(--chip);padding:3px 4px 3px 9px;display:inline-flex;gap:4px;align-items:center}
.pk button{border:0;background:none;color:var(--muted);padding:0 4px;font-size:14px;line-height:1}

.diffs{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:6px}
@media (max-width:760px){.diffs{grid-template-columns:repeat(3,minmax(0,1fr))}}
.diff{border:1px solid var(--rule);background:none;border-radius:8px;padding:9px 10px;text-align:left;min-width:0}
.diff b{display:block;font-size:14px}
.diff span{font-size:11.5px;color:var(--muted)}
.diff i{display:flex;gap:2px;margin-top:6px}
.diff i em{width:9px;height:9px;border-radius:50%;border:1.3px solid var(--omr)}
.diff i em.f{background:var(--omr)}
.diff[aria-pressed="true"]{border-color:var(--omr);box-shadow:inset 0 0 0 1px var(--omr);background:var(--omr-soft)}
.diff-desc{margin-top:10px;font-size:13.5px;color:var(--muted);border-left:2px solid var(--omr);padding-left:10px}

.types{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
@media (max-width:760px){.types{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:380px){.types{grid-template-columns:minmax(0,1fr)}}
.type{display:flex;gap:8px;align-items:flex-start;border:1px solid var(--rule);border-radius:8px;padding:9px 12px;cursor:pointer;min-width:0}
.type input{accent-color:var(--omr);margin-top:4px}
.type b{display:block;font-size:14px}
.type small{color:var(--muted);font-size:12px}
.type.on{border-color:var(--omr);background:var(--omr-soft)}
.mix{margin-top:8px;font-size:13px;color:var(--muted)}

.modes{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
@media (max-width:620px){.modes{grid-template-columns:minmax(0,1fr)}}
.mode{border:1px solid var(--rule);background:none;border-radius:10px;padding:12px 14px;text-align:left}
.mode b{display:block;font-size:14.5px}
.mode span{display:block;font-size:12.5px;color:var(--muted);margin-top:2px}
.mode[aria-pressed="true"]{border-color:var(--ink);box-shadow:inset 0 0 0 1px var(--ink)}
.mode:disabled{opacity:.5;cursor:not-allowed}
.go{margin-top:22px;display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.btn{border:0;background:var(--ink);color:var(--paper);border-radius:10px;padding:13px 22px;font-weight:600;font-size:15.5px}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.red{background:var(--omr);color:#fff}
.btn.sm{padding:9px 14px;font-size:14px;border-radius:8px}
.note{font-size:13px;color:var(--muted)}
.err{color:var(--pen);font-size:13.5px}

/* side cards */
.side{display:flex;flex-direction:column;gap:16px}
.card{padding:18px 18px 16px}
.card h3{font-size:14px;font-weight:600;letter-spacing:.02em;margin-bottom:10px;display:flex;justify-content:space-between;align-items:baseline}
.hist{list-style:none;margin:0;padding:0;display:flex;flex-direction:column}
.hist li{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:2px 10px;padding-block:9px;border-top:1px dashed var(--rule)}
.hist li:first-child{border-top:0}
.hist .s{font-size:13.5px;font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.hist .m{font-size:12px;color:var(--muted);grid-column:1}
.hist .sc{grid-row:1/3;grid-column:2;font-family:var(--f-pen);color:var(--pen);font-size:28px;line-height:1;align-self:center;font-variant-numeric:tabular-nums}
.empty{font-size:13px;color:var(--muted);margin:0}
.legend{display:flex;flex-direction:column;gap:8px;font-size:12.5px;color:var(--muted)}
.legend b{color:var(--ink);font-weight:600;margin-right:6px}

/* exam sheet */
.sheet{padding:30px 34px 36px;position:relative}
@media (max-width:560px){.sheet{padding:22px 16px 28px}}
.sheet-head{text-align:center;border-bottom:3px double var(--rule-strong);padding-bottom:14px;position:relative}
.sheet-meta{display:flex;justify-content:space-between;font-size:12.5px;color:var(--muted);letter-spacing:.04em}
.sheet-title{font-family:var(--f-paper);font-size:30px;letter-spacing:.08em;margin:6px 0 12px}
.info-scroll{overflow-x:auto}
.sheet-info{border-collapse:collapse;margin:0 auto;font-size:13px;min-width:100%}
.sheet-info th,.sheet-info td{border:1px solid var(--rule-strong);padding:5px 10px}
.sheet-info th{font-weight:600;background:var(--chip);white-space:nowrap}
.sheet-info td{text-align:left}
.score-pen{position:absolute;right:-6px;top:-18px;font-family:var(--f-pen);color:var(--pen);font-size:76px;line-height:1;transform:rotate(-9deg);pointer-events:none;font-variant-numeric:tabular-nums}
.score-pen small{font-size:38px}
@media (max-width:560px){.score-pen{font-size:56px;top:-12px;right:-4px}}
.gen{display:flex;align-items:center;gap:12px;margin-top:16px;padding:10px 14px;border:1px dashed var(--omr);border-radius:8px;font-size:13.5px;flex-wrap:wrap}
.dot{width:8px;height:8px;border-radius:50%;background:var(--omr);animation:pulse 1.2s infinite}
@keyframes pulse{50%{opacity:.25}}
@media (prefers-reduced-motion:reduce){.dot{animation:none}}
.sect{font-family:var(--f-paper);font-weight:700;font-size:15px;border-bottom:1px solid var(--rule-strong);padding:20px 0 6px;margin:0;column-span:all}
.qs{list-style:none;margin:6px 0 0;padding:0;columns:2;column-gap:44px;column-rule:1px solid var(--rule)}
.qs.one{columns:1}
@media (max-width:1000px){.qs{columns:1}}
.q{break-inside:avoid;padding-block:18px 14px;font-family:var(--f-paper);font-size:15.5px;line-height:1.75}
.q-head{display:flex;gap:8px}
.q-num{font-weight:700;position:relative;flex:none;min-width:24px}
.q-text{min-width:0;word-break:keep-all;overflow-wrap:anywhere}
.pts{font-family:var(--f-ui);font-size:12px;color:var(--muted);white-space:nowrap}
.data{margin:10px 0 4px 32px;overflow-x:auto;font-size:14px}
.data table{border-collapse:collapse;font-family:var(--f-ui);font-size:13px;font-variant-numeric:tabular-nums}
.data th,.data td{border:1px solid var(--rule-strong);padding:4px 10px;text-align:center}
.data th{background:var(--chip);font-weight:600}
.data p{margin:4px 0}
.box{margin:10px 0 6px 32px;border:1px solid var(--rule-strong);padding:16px 14px 10px;position:relative;font-size:14.5px}
.box::before{content:"<보 기>";position:absolute;top:-11px;left:50%;transform:translateX(-50%);background:var(--paper);padding:0 8px;font-size:13px}
.box div{padding-block:2px}
.opts{display:flex;flex-direction:column;gap:2px;margin:8px 0 0 26px}
.opt{display:flex;gap:6px;align-items:flex-start;border:0;background:none;text-align:left;padding:4px 6px;border-radius:6px;font-family:var(--f-paper);font-size:15px;line-height:1.6}
.opt:hover:not(:disabled){background:var(--chip)}
.opt:disabled{cursor:default}
.cn{flex:none;width:22px;height:22px;border-radius:50%;border:1.3px solid var(--ink);display:grid;place-items:center;font-family:var(--f-ui);font-size:12px;margin-top:2px}
.opt[aria-checked="true"] .cn{background:var(--ink);color:var(--paper)}
.opt.is-ans .cn{box-shadow:0 0 0 2.5px var(--pen)}
.opt.is-ans .ct{text-decoration:underline;text-decoration-color:var(--pen);text-decoration-thickness:2px;text-underline-offset:4px}
.ta{display:block;width:calc(100% - 32px);margin:10px 0 0 32px;min-height:96px;border:1px solid var(--rule-strong);border-radius:4px;background:repeating-linear-gradient(var(--paper) 0 29px,var(--rule) 29px 30px);
  padding:4px 10px;line-height:30px;font-family:var(--f-paper);font-size:15px;resize:vertical}
.ta.essay{min-height:210px}
.ta:disabled{opacity:.9}
.tcount{margin:2px 0 0 32px;font-family:var(--f-ui);font-size:11.5px;color:var(--muted)}
/* grading marks */
.q.correct .q-num::after,.q.part .q-num::after{content:"";position:absolute;left:-9px;top:-5px;width:40px;height:36px;border:2.6px solid var(--pen);border-radius:52% 46% 55% 44%;transform:rotate(-12deg)}
.q.part .q-num::after{border-style:solid;clip-path:polygon(0 0,100% 0,100% 55%,0 55%)}
.q.wrong .q-num::after{content:"";position:absolute;left:-6px;top:-8px;width:3px;height:44px;background:var(--pen);border-radius:3px;transform:rotate(38deg);transform-origin:center}
.review{margin:10px 0 0 32px;font-family:var(--f-ui);font-size:13.5px;line-height:1.6;border-left:2px solid var(--pen);padding:4px 0 4px 12px}
.review .verdict{font-weight:600;color:var(--pen)}
.review .verdict.okc{color:var(--ok)}
.review .lbl{font-weight:600;font-size:12px;color:var(--muted);letter-spacing:.04em;display:block;margin-top:6px}
.review p{margin:2px 0}
.rubric{list-style:none;padding:0;margin:4px 0 0;display:flex;flex-direction:column;gap:4px}
.rubric label{display:flex;gap:8px;align-items:flex-start;cursor:pointer}
.rubric input{accent-color:var(--pen);margin-top:4px;flex:none}
.rubric .p{margin-left:auto;font-variant-numeric:tabular-nums;color:var(--muted);white-space:nowrap}
.fb{font-family:var(--f-pen);color:var(--pen);font-size:21px;line-height:1.3;margin-top:6px}

/* OMR card */
.omr{position:sticky;top:16px;padding:0;overflow:hidden;border:1.5px solid var(--omr)}
.omr-h{background:var(--omr);color:#fff;padding:9px 14px;display:flex;justify-content:space-between;align-items:baseline;font-weight:600;font-size:14px;letter-spacing:.1em}
.omr-h span{font-size:12px;letter-spacing:0;font-weight:500;font-variant-numeric:tabular-nums}
.omr-body{padding:10px 12px 12px;max-height:min(58vh,560px);overflow:auto}
.omr-row{display:grid;grid-template-columns:28px repeat(5,1fr);align-items:center;gap:4px;padding-block:3px;border-bottom:1px solid var(--omr-soft)}
.omr-row:nth-child(5n){border-bottom:1.5px solid var(--omr)}
.omr-n{font-size:12px;color:var(--omr);font-weight:600;text-align:center;font-variant-numeric:tabular-nums}
.bub{width:18px;height:24px;border-radius:50%;border:1.3px solid var(--omr);background:none;font-size:9.5px;color:var(--omr);padding:0;justify-self:center;font-family:var(--f-ui);line-height:1}
.bub.f{background:var(--ink);border-color:var(--ink);color:transparent}
.bub.a{box-shadow:0 0 0 2px var(--pen)}
.bub:disabled{cursor:default}
.omr-w{margin-top:10px;font-size:12px;color:var(--omr);font-weight:600}
.wchips{display:flex;flex-wrap:wrap;gap:5px;margin-top:6px}
.wchip{border:1.3px solid var(--omr);background:none;border-radius:5px;font-size:12px;padding:1px 7px;color:var(--omr);font-variant-numeric:tabular-nums}
.wchip.f{background:var(--ink);border-color:var(--ink);color:var(--paper)}
.omr-foot{padding:12px;border-top:1.5px solid var(--omr);display:flex;flex-direction:column;gap:8px}
.confirm{font-size:13px;display:flex;flex-direction:column;gap:8px}
.confirm .row{display:flex;gap:8px;flex-wrap:wrap}
@media (max-width:900px){.omr{position:static}.exam-side{order:2}}

/* result card */
.res{padding:20px 18px}
.res .big{font-family:var(--f-pen);color:var(--pen);font-size:64px;line-height:.9;font-variant-numeric:tabular-nums}
.res .big small{font-size:30px}
.res .tag{display:inline-block;margin-top:6px;font-size:12.5px;font-weight:600;border:1.5px solid var(--pen);color:var(--pen);border-radius:5px;padding:1px 8px}
.kv{display:grid;grid-template-columns:auto 1fr;gap:4px 14px;font-size:13.5px;margin:14px 0 0}
.kv dt{color:var(--muted)}
.kv dd{margin:0;text-align:right;font-variant-numeric:tabular-nums}
.bars{display:flex;flex-direction:column;gap:9px;margin-top:16px;padding-top:14px;border-top:1px solid var(--rule)}
.bar-l{display:flex;justify-content:space-between;font-size:12.5px;gap:8px}
.bar-l span:first-child{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bar-t{height:7px;border-radius:4px;background:var(--chip);overflow:hidden;margin-top:3px}
.bar-t i{display:block;height:100%;background:var(--ink);border-radius:4px}
.res-actions{display:flex;flex-direction:column;gap:8px;margin-top:18px}
.grading{margin-top:12px;font-size:13px;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
@media (max-width:900px){.result-side{order:-1}}

/* OX, line matching, short answer */
.oxs{display:flex;gap:10px;margin:10px 0 0 32px}
.oxb{width:58px;height:44px;border:1.5px solid var(--ink);border-radius:8px;background:none;font-size:22px;font-weight:700;font-family:var(--f-ui);line-height:1}
.oxb:hover:not(:disabled){background:var(--chip)}
.oxb.on{background:var(--ink);color:var(--paper)}
.oxb.is-ans{box-shadow:0 0 0 3px var(--pen)}
.oxb:disabled{cursor:default}
.match{position:relative;display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);column-gap:56px;margin:12px 0 0 32px}
@media (max-width:560px){.match{margin-left:0;column-gap:34px}}
.mlines{position:absolute;left:0;top:0;width:100%;height:100%;pointer-events:none;overflow:visible}
.mcol{display:flex;flex-direction:column;gap:8px;min-width:0}
.mi{display:flex;align-items:center;gap:8px;border:1px solid var(--rule);border-radius:8px;padding:8px 10px;background:var(--paper);text-align:left;width:100%;font-family:var(--f-paper);font-size:14.5px;line-height:1.5;min-height:44px;min-width:0}
.mi:hover:not(:disabled){border-color:var(--muted)}
.mi:disabled{cursor:default}
.mi .mt{min-width:0;overflow-wrap:anywhere;flex:1}
.mi .mlab{font-family:var(--f-ui);font-weight:600;font-size:12.5px;color:var(--muted);flex:none}
.mdot{width:12px;height:12px;border-radius:50%;border:2px solid var(--ink);background:var(--paper);flex:none}
.mi.L .mdot{margin-left:auto}
.mi.on .mdot{background:var(--ink)}
.mi.sel{border-color:var(--omr);box-shadow:0 0 0 2px var(--omr-soft)}
.mi.sel .mdot{border-color:var(--omr);background:var(--omr)}
.mhint{margin:6px 0 0 32px;font-family:var(--f-ui);font-size:12px;color:var(--muted);display:flex;gap:10px;align-items:center;flex-wrap:wrap}
@media (max-width:560px){.mhint{margin-left:0}}
.fillin{display:block;margin:10px 0 0 32px;border:0;border-bottom:1.5px solid var(--ink);background:none;padding:4px 2px;font-family:var(--f-paper);font-size:16px;width:min(300px,calc(100% - 32px));border-radius:0}
.fillin:disabled{opacity:.9}

m3c:[S('자유 낙하하는 물체의 운동에 대한 설명으로 옳은 것은? (단, 공기 저항은 무시)',['속력이 1초에 9.8 m/s씩 일정하게 증가한다','속력이 일정하다','무거운 물체가 더 빨리 떨어진다','작용하는 힘이 점점 커진다','운동 방향과 반대로 힘이 작용한다'],0,'자유 낙하하는 물체에는 일정한 중력이 작용해 속력이 매초 9.8 m/s씩 증가하며, 질량과 관계없이 같은 빠르기로 떨어진다.',1),

m3e:[S('체세포 분열과 감수 분열을 비교한 설명으로 옳은 것은?',['감수 분열 결과 만들어진 딸세포의 염색체 수는 모세포의 절반이다','체세포 분열은 2회 연속 분열한다','감수 분열에서는 상동 염색체가 접합하지 않는다','체세포 분열 결과 딸세포 4개가 생긴다','두 분열 모두 염색체 수가 절반으로 준다'],0,'감수 분열은 연속 2회 분열로 딸세포 4개가 생기고 염색체 수가 절반이 된다. 체세포 분열은 1회 분열로 염색체 수가 같은 딸세포 2개가 생긴다.',1),

m3h:[S('다음 중 나노 기술을 활용한 사례로 가장 적절한 것은?',['연잎 표면 구조를 본뜬 발수 섬유','증기 기관','활판 인쇄술','망원경','나침반'],0,'연잎 표면의 나노 구조를 모방한 발수 섬유와 코팅은 대표적인 나노 기술 활용 사례이다.',1),

 S('코일 근처에서 자석을 움직이면 코일에 전류가 흐른다. 이 현상을 이용한 장치가 아닌 것은?',['발전기','교통카드 단말기','전기 기타의 픽업','전동기','변압기'],3,'전동기는 자기장 속에서 전류가 흐르는 도선이 받는 힘을 이용한다. 나머지는 전자기 유도를 이용한다.',3)],
h1a:[S('마찰이 없는 수평면에서 질량 2 kg, 속력 3 m/s로 운동하던 물체 A가 정지해 있던 질량 1 kg인 물체 B와 충돌한 뒤 한 덩어리가 되어 운동했다. 충돌 후 속력은?',['1 m/s','1.5 m/s','2 m/s','3 m/s','6 m/s'],2,'운동량 보존: 2×3 = (2+1)v → v = 2 m/s.',3),

h1b:[S('보어의 수소 원자 모형에서 전자가 전이할 때 방출되는 빛에 대한 설명으로 옳은 것은?',['두 에너지 준위의 차이가 클수록 방출되는 빛의 진동수가 크다','전자가 낮은 준위에서 높은 준위로 전이할 때 빛을 방출한다','방출되는 빛의 스펙트럼은 연속 스펙트럼이다','n=2 → n=1 전이에서 가시광선이 방출된다','에너지 준위는 연속적인 값을 가진다'],0,'E = hf이므로 에너지 차가 클수록 진동수가 크다. 높은 준위→낮은 준위에서 방출하며 선 스펙트럼이 나타난다. n=2→1은 자외선(라이먼 계열)이다.',2),
 S('순수한 규소(Si)에 붕소(B)를 소량 첨가해 만든 반도체에 대한 설명으로 옳은 것은?',['p형 반도체이며 주로 양공이 전류를 운반한다','n형 반도체이며 주로 전자가 전류를 운반한다','p형 반도체이며 주로 전자가 전류를 운반한다','도체가 되어 띠틈이 사라진다','절연체가 된다'],0,'원자가 전자가 3개인 붕소를 첨가하면 양공이 생기는 p형 반도체가 된다.',2),
 S('나란한 두 직선 도선에 같은 방향으로 전류가 흐를 때 두 도선 사이에 작용하는 힘은?',['서로 당기는 힘','서로 미는 힘','힘이 작용하지 않는다','전류가 클수록 미는 힘이 커진다','도선 길이와 관계없이 0이다'],0,'같은 방향의 전류는 서로 당기고, 반대 방향의 전류는 서로 민다.',3)],
h1c:[S('빛이 공기에서 물로 비스듬히 진행할 때 변하지 않는 것은?',['진동수','속력','파장','진행 방향','파장과 속력 모두'],0,'굴절할 때 진동수는 변하지 않고, 속력과 파장이 줄어들며 진행 방향이 꺾인다.',2),
 S('전반사가 일어나기 위한 조건으로 옳은 것은?',['굴절률이 큰 매질에서 작은 매질로 진행하고, 입사각이 임계각보다 클 때','굴절률이 작은 매질에서 큰 매질로 진행하고, 입사각이 임계각보다 클 때','굴절률이 큰 매질에서 작은 매질로 진행하고, 입사각이 임계각보다 작을 때','두 매질의 굴절률이 같을 때','입사각이 0°일 때'],0,'전반사는 빛이 굴절률이 큰 매질에서 작은 매질로 진행하며 입사각이 임계각보다 클 때 일어난다.',2),
 S('금속판에 빛을 비출 때 광전자가 방출되지 않았다. 광전자를 방출시키기 위한 방법으로 옳은 것은?',['진동수가 더 큰 빛을 비춘다','같은 빛을 더 강하게 비춘다','빛을 더 오래 비춘다','금속판을 더 크게 한다','파장이 더 긴 빛을 비춘다'],0,'광전 효과는 문턱 진동수 이상의 빛에서만 일어나며, 빛의 세기나 비춘 시간과는 관계없다.',2)],
h2a:[S('메테인(CH₄) 1 mol이 완전 연소할 때 필요한 산소(O₂)의 양은?',['0.5 mol','1 mol','2 mol','3 mol','4 mol'],2,'CH₄ + 2O₂ → CO₂ + 2H₂O이므로 2 mol이 필요하다.',2),

 S('다음 중 실험식(가장 간단한 정수비)이 CH₂O인 물질은?',['포도당(C₆H₁₂O₆)','에탄올(C₂H₅OH)','메테인(CH₄)','에테인(C₂H₆)','이산화 탄소(CO₂)'],0,'C₆H₁₂O₆의 원자 수 비는 6 : 12 : 6 = 1 : 2 : 1이므로 실험식은 CH₂O이다.',3)],
h2b:[S('주 양자수 n=2인 전자 껍질에 들어갈 수 있는 최대 전자 수는?',['2','4','6','8','18'],3,'최대 전자 수는 2n² = 8개(2s 2개 + 2p 6개)이다.',2),
 S('2주기 원소에서 원자 번호가 커질수록 원자 반지름이 작아지는 주된 까닭은?',['유효 핵전하가 커지기 때문','전자 껍질 수가 많아지기 때문','중성자 수가 줄어들기 때문','원자가 전자 수가 줄어들기 때문','전자 사이의 반발력이 커지기 때문'],0,'같은 주기에서는 전자 껍질 수가 같고 유효 핵전하가 커져 전자를 더 강하게 끌어당긴다.',2),
 S('2주기 원소의 제1 이온화 에너지에 대한 설명으로 옳은 것은?',['N가 O보다 크다','Be가 B보다 작다','Li가 가장 크다','O가 F보다 크다','원자 번호가 클수록 예외 없이 증가한다'],0,'2주기에서 이온화 에너지는 대체로 증가하지만 Be > B, N > O의 예외가 있다. O는 2p 오비탈에 쌍을 이룬 전자의 반발로 전자를 떼기 쉽다. Ne가 가장 크다.',4)],
h2c:[S('다음 분자 중 결합각이 가장 작은 것은?',['H₂O','NH₃','CH₄','BF₃','CO₂'],0,'H₂O(약 104.5°) < NH₃(약 107°) < CH₄(109.5°) < BF₃(120°) < CO₂(180°). 비공유 전자쌍이 많을수록 결합각이 작아진다.',3),
 S('다음 중 극성 분자는?',['H₂O','CO₂','CH₄','BF₃','CCl₄'],0,'H₂O는 굽은형이라 결합의 쌍극자가 상쇄되지 않는다. 나머지는 대칭 구조라 무극성이다.',2),
 S('NaCl과 같은 이온 결합 물질의 성질로 옳은 것은?',['고체에서는 전기가 통하지 않지만 액체나 수용액에서는 통한다','고체 상태에서 전기가 잘 통한다','외부에서 힘을 가하면 잘 펴진다','녹는점이 매우 낮다','분자 단위로 존재한다'],0,'고체에서는 이온이 고정되어 전기가 통하지 않지만 녹거나 물에 녹으면 이온이 움직여 전기가 통한다. 힘을 가하면 쉽게 부서진다.',1)],
h2d:[S('25 ℃에서 [H₃O⁺]가 1×10⁻³ M인 수용액의 pH는?',['1','3','7','11','−3'],1,'pH = −log[H₃O⁺] = 3.',1),

h3a:[S('에이크만은 백미를 먹인 닭은 각기병 증상을 보이고 현미를 먹인 닭은 회복된다는 실험으로 결론을 얻었다. 이처럼 가설을 세우고 실험으로 검증하는 탐구 방법은?',['연역적 탐구','귀납적 탐구','관찰 탐구','문헌 조사','모형 탐구'],0,'가설을 설정하고 대조 실험으로 검증하는 방법은 연역적 탐구이다.',2),
 S('생물의 특성 중 항상성의 예로 가장 적절한 것은?',['더울 때 땀을 흘려 체온을 유지한다','올챙이가 자라 개구리가 된다','효모가 포도당을 분해해 에너지를 얻는다','짚신벌레가 분열해 개체 수가 늘어난다','선인장의 잎이 가시로 변했다'],0,'체온 유지는 항상성, 개구리는 발생과 생장, 효모는 물질대사, 분열은 생식, 선인장 가시는 적응과 진화의 예이다.',1)],
h3b:[S('세포 호흡에 대한 설명으로 옳은 것은?',['주로 미토콘드리아에서 일어나며 포도당의 에너지 일부가 ATP에 저장된다','빛에너지를 화학 에너지로 전환한다','엽록체에서만 일어난다','에너지를 흡수하는 동화 작용이다','산소를 생성한다'],0,'세포 호흡은 이화 작용으로, 주로 미토콘드리아에서 산소를 이용해 포도당을 분해하고 에너지 일부를 ATP에 저장한다.',1),
 S('단백질이 분해될 때 생성되는 암모니아에 대한 설명으로 옳은 것은?',['독성이 강해 간에서 요소로 바뀐 뒤 콩팥으로 배설된다','폐를 통해 그대로 배출된다','이자에서 요소로 바뀐다','지방이 분해될 때 주로 생성된다','콩팥에서 포도당으로 바뀐다'],0,'암모니아는 간에서 독성이 약한 요소로 바뀐 뒤 콩팥에서 오줌으로 배설된다.',2)],
h3c:[S('뉴런에서 활동 전위가 발생할 때 탈분극이 일어나는 주된 원인은?',['Na⁺ 통로가 열려 Na⁺이 세포 안으로 확산되기 때문','K⁺ 통로가 열려 K⁺이 세포 밖으로 확산되기 때문','Na⁺-K⁺ 펌프가 Na⁺을 세포 안으로 들여보내기 때문','Cl⁻이 세포 밖으로 나가기 때문','ATP가 세포 밖으로 방출되기 때문'],0,'탈분극은 전압 개폐성 Na⁺ 통로가 열려 Na⁺이 유입되면서 일어난다. 재분극은 K⁺ 유출 때문이며, Na⁺-K⁺ 펌프는 Na⁺을 밖으로 내보낸다.',2),
 S('같은 항원이 두 번째로 침입했을 때 1차 면역 반응보다 빠르게 많은 항체가 생성되는 까닭은?',['1차 면역 반응 때 생긴 기억 세포가 빠르게 형질 세포로 분화하기 때문','항원이 약해졌기 때문','대식세포가 모두 사라졌기 때문','항체가 혈액에 계속 같은 농도로 남아 있기 때문','T 림프구가 항체를 직접 만들기 때문'],0,'2차 면역 반응에서는 기억 세포가 빠르게 증식·분화해 형질 세포가 많은 항체를 만든다.',2),
 S('골격근이 수축할 때 근육 원섬유 마디의 변화로 옳은 것은?',['H대와 I대는 짧아지고 A대의 길이는 변하지 않는다','A대가 짧아지고 I대는 변하지 않는다','액틴 필라멘트의 길이가 짧아진다','마이오신 필라멘트의 길이가 짧아진다','H대가 길어진다'],0,'액틴이 마이오신 사이로 미끄러져 들어가며 수축하므로 필라멘트 길이는 그대로이다. A대는 일정하고 H대와 I대가 짧아진다.',3)],
h3d:[S('사람의 체세포 1개와 정자 1개에 들어 있는 염색체 수를 옳게 짝 지은 것은?',['46개, 23개','46개, 46개','23개, 23개','44개, 22개','48개, 24개'],0,'사람의 체세포는 2n=46, 생식세포는 n=23이다.',1),
 S('감수 1분열에서 일어나는 일로 옳은 것은?',['상동 염색체가 분리된다','염색 분체만 분리된다','DNA가 복제되지 않은 상태로 시작한다','딸세포의 핵상이 2n이다','2가 염색체가 형성되지 않는다'],0,'감수 1분열에서는 2가 염색체가 형성된 뒤 상동 염색체가 분리되어 핵상이 2n→n이 된다. 염색 분체 분리는 감수 2분열에서 일어난다.',2),
 S('다음 중 다인자 유전의 예로 가장 적절한 것은?',['사람의 피부색','ABO식 혈액형','적록 색맹','혀 말기','귓불 모양'],0,'피부색이나 키처럼 여러 쌍의 대립유전자가 관여하고 환경의 영향을 받아 연속적인 변이를 보이는 것이 다인자 유전이다.',2)],
h3e:[S('다음 중 한 개체군 안에서 나타나는 상호 작용은?',['텃세','경쟁 배타','상리 공생','기생','포식과 피식'],0,'텃세, 순위제, 리더제, 사회생활, 가족생활은 개체군 내 상호 작용이고, 나머지는 서로 다른 개체군 사이의 상호 작용이다.',2),
 S('콩과식물의 뿌리혹에 사는 뿌리혹박테리아가 하는 일은?',['대기 중의 질소(N₂)를 암모늄 이온(NH₄⁺)으로 고정한다','질산 이온을 질소 기체로 바꾼다','이산화 탄소를 흡수해 광합성을 한다','유기물을 분해해 메테인을 만든다','인을 흡수해 토양에 저장한다'],0,'뿌리혹박테리아는 질소 고정 세균으로, 대기 중 N₂를 NH₄⁺으로 바꾼다.',2),
 S('식물 군집의 1차 천이(건성 천이) 과정으로 옳은 것은?',['지의류 → 초원 → 관목림 → 양수림 → 혼합림 → 음수림','초원 → 지의류 → 양수림 → 관목림 → 음수림','지의류 → 음수림 → 양수림 → 초원','음수림 → 양수림 → 관목림 → 초원 → 지의류','관목림 → 지의류 → 초원 → 음수림'],0,'맨땅에서 지의류가 먼저 정착하고 초원, 관목림, 양수림, 혼합림을 거쳐 음수림(극상)에 이른다.',2)],
h4a:[S('해령을 중심으로 해양 지각의 고지자기 줄무늬가 대칭적으로 나타나는 것이 지지하는 이론은?',['해양저 확장설','지구 수축설','지향사설','정적 지구설','육교설'],0,'해령에서 생성된 해양 지각이 양쪽으로 멀어지며 당시 지구 자기장의 방향을 기록해 대칭 줄무늬가 생긴다.',2),
 S('암석 A를 화성암 B가 관입하고 있다. A와 B의 생성 순서를 판단하는 법칙과 결과는?',['관입의 법칙 – A가 B보다 먼저 생성','관입의 법칙 – B가 A보다 먼저 생성','수평 퇴적의 법칙 – A가 먼저','동물군 천이의 법칙 – B가 먼저','부정합의 법칙 – 동시에 생성'],0,'관입당한 암석이 관입한 암석보다 먼저 생성되었다.',2),

m2h:[W('short','철로의 이음매 사이에 틈을 두는 까닭을 열팽창으로 서술하시오.','온도가 높아지면 철을 이루는 입자의 운동이 활발해져 철로가 팽창한다. 틈이 없으면 팽창한 철로가 휘어질 수 있어 틈을 둔다.',[['온도가 오르면 입자 운동이 활발해져 철로가 팽창',3],['틈이 없으면 철로가 휘어지는 것을 막기 위함',2]],1)],
m2i:[W('short','감염병 확산을 막기 위해 개인이 할 수 있는 대처 방법을 두 가지 서술하시오.','손을 자주 씻고 마스크를 써서 병원체의 전파 경로를 차단한다. 예방 접종을 받고, 증상이 있으면 외출을 줄여 다른 사람과의 접촉을 피한다.',[['손 씻기·마스크 등 전파 경로 차단',2],['예방 접종 또는 증상 시 접촉 줄이기',2],['두 가지를 구체적으로 제시',1]],1)],
m3a:[W('short','나무를 태우고 남은 재의 질량은 처음 나무보다 작다. 그런데도 질량 보존 법칙이 성립한다고 할 수 있는 까닭을 서술하시오.','나무가 연소할 때 생성된 이산화 탄소와 수증기가 공기 중으로 날아가기 때문에 재의 질량이 작다. 반응한 산소와 생성된 기체까지 모두 포함하면 반응 전후의 질량은 같다.',[['생성된 이산화 탄소·수증기가 공기 중으로 날아감',3],['반응한 산소·생성 기체까지 포함하면 질량이 같음',2]],2)],
m3b:[W('short','맑은 날 밤에 지표면 부근에 안개가 잘 생기는 까닭을 서술하시오.','맑은 날 밤에는 구름이 없어 지표가 복사 냉각되어 지표 부근 공기의 기온이 내려가고, 기온이 이슬점 이하가 되면 수증기가 응결해 안개가 생긴다.',[['밤에 지표의 복사 냉각으로 기온 하강',2],['기온이 이슬점 이하로 내려가 수증기가 응결',3]],2),
 W('essay','우리나라 겨울철에 북서 계절풍이 부는 까닭과 그로 인한 날씨의 특징을 기단과 기압 분포와 관련지어 논술하시오.','겨울에는 대륙이 바다보다 빨리 냉각되어 시베리아 대륙에 차고 건조한 시베리아 기단(고기압)이 발달하고, 상대적으로 따뜻한 바다 쪽은 기압이 낮다. 바람은 고기압에서 저기압으로 불므로 대륙에서 바다 쪽으로 북서풍이 분다. 이 때문에 춥고 건조하며, 기압 배치가 서고동저형으로 나타난다. 찬 기단이 따뜻한 황해를 지나며 수증기를 공급받아 서해안에 눈이 많이 내리기도 한다.',[['대륙과 바다의 비열 차이로 대륙에 고기압 발달',3],['시베리아 기단의 성질(한랭 건조)과 고기압→저기압 바람',3],['날씨 특징(추위, 건조, 서고동저, 서해안 폭설 등)',2],['논리적 구성과 정확한 과학 용어',2]],4)],
m3c:[W('short','롤러코스터가 높은 곳에서 내려올수록 속력이 빨라지는 까닭을 에너지 전환으로 서술하시오.','내려올수록 높이가 낮아져 위치 에너지가 감소하고, 감소한 위치 에너지가 운동 에너지로 전환되어 운동 에너지가 커지므로 속력이 빨라진다.',[['높이가 낮아지며 위치 에너지 감소',2],['감소한 위치 에너지가 운동 에너지로 전환',2],['운동 에너지 증가로 속력 증가',1]],2)],
m3d:[W('short','뜨거운 물체에 손이 닿았을 때 뜨겁다고 느끼기 전에 손을 먼저 떼는 까닭을 서술하시오.','이 반응은 척수가 중추인 무조건 반사로, 자극이 대뇌를 거치지 않고 척수에서 바로 운동 신경으로 전달되므로 대뇌가 뜨거움을 느끼기 전에 빠르게 반응한다.',[['척수가 중추인 무조건 반사',3],['대뇌를 거치지 않아 반응이 빠름',2]],2)],
m3e:[W('short','생식세포의 염색체 수가 체세포의 절반이어야 하는 까닭을 서술하시오.','수정할 때 난자와 정자가 합쳐지므로, 생식세포의 염색체 수가 절반이어야 수정란의 염색체 수가 부모의 체세포와 같아져 대를 거듭해도 염색체 수가 일정하게 유지된다.',[['수정으로 두 생식세포가 합쳐짐',2],['자손의 염색체 수가 대대로 일정하게 유지됨',3]],2),
 W('essay','멘델이 완두를 실험 재료로 쓴 것이 유리했던 까닭을 세 가지 들고, 우열의 원리와 분리의 법칙을 논술하시오.','완두는 대립 형질이 뚜렷하고, 자가 수분과 타가 수분이 쉬워 교배를 조절하기 쉬우며, 한 세대가 짧고 자손 수가 많아 통계 처리에 유리하다. 순종 둥근 완두와 순종 주름진 완두를 교배하면 잡종 1대는 모두 둥근 완두만 나타나는데, 이는 대립 형질 중 우성만 표현되는 우열의 원리이다. 잡종 1대를 자가 수분하면 쌍을 이룬 유전자가 생식세포로 나뉘어 들어가는 분리의 법칙에 따라 잡종 2대에서 둥근 : 주름진 = 3 : 1이 나타난다.',[['완두가 유리한 까닭 세 가지(대립 형질 뚜렷, 교배 조절 쉬움, 세대 짧고 자손 많음)',3],['우열의 원리와 잡종 1대 결과',2],['분리의 법칙과 잡종 2대 3:1',3],['논리적 구성과 정확한 과학 용어',2]],3)],
m3f:[W('short','실제 진자 운동에서 진자가 점점 낮게 올라가는 까닭을 에너지 보존과 함께 서술하시오.','공기 저항과 마찰 때문에 역학적 에너지의 일부가 열에너지나 소리 에너지로 전환되어 역학적 에너지가 줄어든다. 그러나 전환된 에너지까지 합한 전체 에너지의 양은 보존된다.',[['마찰·공기 저항으로 일부가 열·소리 에너지로 전환',3],['전체 에너지의 총량은 보존됨',2]],2)],
m3g:[W('short','별 A는 별 B보다 겉보기 등급은 작지만 절대 등급은 크다. 지구에서 더 가까운 별을 쓰고, 그 까닭을 서술하시오.','A이다. 겉보기 등급이 작은 A가 지구에서 더 밝게 보이지만, 절대 등급이 크므로 실제 밝기는 B보다 어둡다. 실제로 어두운데 더 밝게 보이므로 A가 더 가까이 있다.',[['답: A',2],['겉보기 등급이 작으면 밝게 보이고 절대 등급이 크면 실제로 어두움',2],['실제로 어두운데 밝게 보이므로 가까움',1]],3)],
m3h:[W('short','과학기술의 발달로 생긴 문제점 한 가지와 그 해결 방안을 서술하시오.','예를 들어 플라스틱 사용이 늘면서 미세 플라스틱 오염이 생겼다. 생분해성 플라스틱을 개발하고 재활용 체계를 강화하며 일회용품 사용을 줄일 수 있다.',[['과학기술로 생긴 구체적 문제점',2],['문제점에 맞는 구체적 해결 방안',3]],1)],
h0a:[W('short','빅뱅 직후에는 만들어지지 않은 탄소, 산소, 철 같은 무거운 원소가 어떻게 생성되었는지 서술하시오.','별의 중심부에서 핵융합으로 헬륨보다 무거운 탄소, 산소 등이 생성되고, 질량이 큰 별의 중심부에서는 철까지 생성된다. 철보다 무거운 원소는 초신성 폭발 과정에서 만들어진다.',[['별 내부 핵융합으로 탄소·산소 등 생성',2],['질량이 큰 별 중심부에서 철까지 생성',1],['철보다 무거운 원소는 초신성 폭발로 생성',2]],2)],

h0c:[W('short','산성화된 호수에 석회 가루(염기성 물질)를 뿌리는 까닭을 서술하시오.','석회의 염기 성분이 호수 속 산의 H⁺과 중화 반응을 하여 H⁺ 농도를 줄이므로 pH가 높아져 산성이 약해진다.',[['중화 반응',3],['H⁺이 줄어 pH가 높아짐(산성 약화)',2]],2)],
h0d:[W('short','화석 연료 사용이 지구 온난화를 일으키는 과정을 서술하시오.','화석 연료를 태우면 이산화 탄소가 배출된다. 이산화 탄소 같은 온실 기체는 지표가 방출하는 적외선 복사 에너지를 흡수했다가 다시 지표로 방출하므로 온실 효과가 강해져 지구의 평균 기온이 올라간다.',[['화석 연료 연소로 이산화 탄소 배출',2],['온실 기체가 지표 복사 에너지를 흡수·재방출',2],['지구 평균 기온 상승',1]],2),
 W('essay','신재생 에너지의 장점과 한계를 화석 연료와 비교하여 논술하시오. (두 가지 이상의 에너지원을 예로 들 것)','태양광과 풍력은 발전 과정에서 이산화 탄소를 거의 배출하지 않고 자원이 고갈되지 않는다는 점에서 화석 연료보다 유리하다. 그러나 날씨와 시간에 따라 발전량이 달라 공급이 불안정하고, 넓은 부지와 높은 초기 설치 비용이 필요하다. 화석 연료는 에너지 밀도가 높고 원하는 때에 발전할 수 있지만 온실 기체와 대기 오염 물질을 배출하고 매장량이 한정되어 있다. 따라서 에너지 저장 장치(ESS) 개발, 전력망 개선과 함께 신재생 에너지 비중을 늘려 나가야 한다.',[['두 가지 이상의 신재생 에너지원 제시',2],['장점(온실 기체 감소, 고갈 없음) 설명',2],['한계(간헐성, 부지·비용 등) 설명',3],['화석 연료와의 비교와 해결 방향 제시',3]],3)],
h1a:[W('short','열기관의 열효율이 100 %가 될 수 없는 까닭을 열역학 제2법칙과 관련지어 서술하시오.','열역학 제2법칙에 따라 열은 스스로 모두 일로 바뀔 수 없으므로, 열기관은 흡수한 열의 일부를 반드시 저열원으로 방출해야 한다. 따라서 열효율은 100 %가 될 수 없다.',[['흡수한 열의 일부는 반드시 저열원으로 방출',3],['열을 모두 일로 바꿀 수 없다는 제2법칙',2]],3),
 W('essay','자동차 안전 장치(안전띠, 에어백, 범퍼의 찌그러지는 구조)가 탑승자를 보호하는 원리를 관성, 운동량, 충격량 개념으로 논술하시오.','자동차가 갑자기 멈추면 탑승자는 관성에 의해 계속 앞으로 움직이려 한다. 안전띠는 탑승자를 차와 함께 멈추게 해 앞으로 튕겨 나가는 것을 막는다. 탑승자가 정지할 때까지의 운동량 변화량, 즉 충격량은 정해져 있으므로, 에어백과 찌그러지는 범퍼는 충돌 시간을 늘려 같은 충격량에서 받는 평균 힘을 줄인다. 범퍼는 찌그러지며 충돌 에너지를 흡수해 탑승 공간으로 전달되는 충격을 줄인다.',[['관성과 안전띠의 역할',2],['충격량 = 운동량 변화량 = 힘×시간 관계 제시',3],['에어백·범퍼가 충돌 시간을 늘려 평균 힘을 줄임',3],['논리적 구성과 정확한 과학 용어',2]],3)],
h1b:[W('short','발광 다이오드(LED)가 빛을 내는 원리를 에너지띠를 들어 서술하시오.','순방향 전압을 걸면 n형의 전자와 p형의 양공이 접합면으로 이동해 결합한다. 이때 전도띠의 전자가 원자가 띠로 떨어지며 띠틈에 해당하는 에너지를 빛으로 방출한다.',[['순방향 전압에서 전자와 양공이 접합면에서 결합',2],['전도띠의 전자가 원자가 띠로 전이',2],['띠틈에 해당하는 에너지가 빛으로 방출',1]],3)],
h1c:[W('short','광섬유에서 빛이 밖으로 새어 나가지 않고 진행하는 원리를 서술하시오.','광섬유의 중심부(코어)는 바깥(클래딩)보다 굴절률이 크고, 빛이 경계면에 임계각보다 큰 입사각으로 들어가므로 전반사를 반복하며 진행한다.',[['코어의 굴절률이 클래딩보다 큼',2],['입사각이 임계각보다 커서 전반사',3]],2)],
h2a:[W('short','화학 반응식의 계수비가 의미하는 바를 몰과 관련지어 서술하시오.','계수비는 반응하거나 생성되는 물질의 몰수비(입자 수의 비)와 같다. 기체의 경우 같은 온도와 압력에서는 부피비와도 같다.',[['계수비 = 몰수비(입자 수의 비)',3],['기체는 같은 조건에서 부피비와 같음',2]],2)],
h2b:[W('short','Na⁺의 반지름이 Na 원자보다 작은 까닭을 서술하시오.','Na이 전자 1개를 잃어 Na⁺이 되면 가장 바깥 전자 껍질이 없어져 전자 껍질 수가 줄어들고, 전자 수가 줄어 유효 핵전하가 커지므로 반지름이 작아진다.',[['전자를 잃어 전자 껍질 수가 줄어듦',3],['유효 핵전하가 커져 전자를 강하게 당김',2]],2)],
h2c:[W('short','CO₂는 C=O 결합이 극성 공유 결합인데도 무극성 분자인 까닭을 서술하시오.','CO₂는 결합각이 180°인 직선형 구조이므로 두 C=O 결합의 쌍극자 모멘트가 크기는 같고 방향이 반대여서 서로 상쇄된다.',[['직선형 구조(180°)',2],['두 결합의 쌍극자 모멘트가 상쇄됨',3]],2),
 W('essay','물의 끓는점이 분자량이 비슷한 다른 분자보다 높고, 얼음이 물에 뜨는 까닭을 물 분자의 구조와 분자 사이의 힘으로 논술하시오.','물 분자는 산소의 전기 음성도가 커서 O−H 결합이 극성을 띠고, 굽은형 구조라 극성 분자이다. 한 물 분자의 H와 이웃 분자의 O 사이에 강한 수소 결합이 생기므로 분자 사이 인력이 커서 끓는점이 높다. 얼음이 될 때는 수소 결합이 일정한 방향으로 형성되어 빈 공간이 많은 육각형 구조를 이루므로 부피가 커지고 밀도가 물보다 작아져 물에 뜬다.',[['물 분자의 극성(전기 음성도 차, 굽은형 구조)',2],['수소 결합으로 분자 사이 인력이 커 끓는점이 높음',3],['얼음의 육각형 구조로 부피 증가·밀도 감소',3],['논리적 구성과 정확한 과학 용어',2]],4)],
h2d:[W('short','철이 녹스는 반응 4Fe + 3O₂ → 2Fe₂O₃에서 산화되는 물질과 환원되는 물질을 산화수 변화로 서술하시오.','Fe의 산화수가 0에서 +3으로 증가하므로 Fe는 산화되고, O의 산화수가 0에서 −2로 감소하므로 O₂는 환원된다.',[['Fe: 0 → +3, 산화됨',3],['O: 0 → −2, 환원됨',2]],2)],
h3a:[W('short','바이러스를 생물과 무생물의 중간 단계로 보는 까닭을 서술하시오.','바이러스는 숙주 세포 밖에서는 스스로 물질대사를 하지 못하고 단백질 결정처럼 존재해 무생물의 특성을 보인다. 그러나 숙주 세포 안에서는 유전 물질을 이용해 증식하고 돌연변이로 진화하는 생물의 특성을 보인다.',[['숙주 밖에서는 물질대사를 못 함(무생물적 특성)',2],['숙주 안에서 유전 물질로 증식·진화(생물적 특성)',3]],2)],
h3b:[W('short','운동할 때 호흡과 심장 박동이 빨라지는 까닭을 세포 호흡과 관련지어 서술하시오.','운동하면 근육 세포에서 세포 호흡이 활발해져 ATP가 많이 필요하다. 이를 위해 더 많은 산소와 포도당을 공급하고 생성된 이산화 탄소를 빨리 내보내야 하므로 호흡과 심장 박동이 빨라진다.',[['근육 세포의 세포 호흡 증가(ATP 필요량 증가)',2],['더 많은 산소와 영양소 공급',2],['이산화 탄소를 빨리 배출',1]],2)],
h3c:[W('short','혈당량이 낮을 때 이자에서 분비되는 호르몬과 그 작용을 서술하시오.','이자의 α세포에서 글루카곤이 분비되어 간에 저장된 글리코젠을 포도당으로 분해하게 하므로 혈당량이 높아진다.',[['글루카곤(이자 α세포)',2],['간에서 글리코젠을 포도당으로 분해',2],['혈당량 증가',1]],2),
 W('essay','백신 접종이 감염병 예방에 효과적인 원리를 1차 면역 반응과 2차 면역 반응을 비교하여 논술하시오.','백신은 병원성을 없애거나 약하게 만든 항원으로, 접종하면 1차 면역 반응이 일어난다. 1차 반응에서는 B 림프구가 보조 T 림프구의 도움을 받아 형질 세포와 기억 세포로 분화하는데, 항체가 생기기까지 시간이 걸리고 양도 적다. 이후 같은 병원체가 실제로 침입하면 기억 세포가 빠르게 형질 세포로 분화하는 2차 면역 반응이 일어나 짧은 시간에 많은 항체가 만들어지므로 발병 전에 병원체를 제거할 수 있다.',[['백신이 약화된 항원으로 1차 면역 반응을 일으킴',2],['1차 반응: 기억 세포 형성, 느리고 적은 항체',3],['2차 반응: 기억 세포가 빠르게 분화해 많은 항체 생성',3],['논리적 구성과 정확한 과학 용어',2]],3)],
h3d:[W('short','다운 증후군이 생기는 원인을 감수 분열 과정과 관련지어 서술하시오.','감수 분열 과정에서 21번 염색체가 분리되지 않는 염색체 비분리가 일어나 21번 염색체를 2개 가진 생식세포가 수정되면, 21번 염색체가 3개인 자손이 태어난다.',[['21번 염색체가 3개',2],['감수 분열 때 염색체 비분리',3]],3)],
h3e:[W('short','생태계에서 물질은 순환하지만 에너지는 순환하지 않는 까닭을 서술하시오.','에너지는 각 영양 단계에서 호흡 등을 통해 열에너지로 방출되어 생태계 밖으로 빠져나가므로 순환하지 않는다. 반면 물질은 분해자에 의해 무기물로 분해되어 다시 생산자에게 이용되므로 순환한다.',[['에너지는 열로 방출되어 생태계 밖으로 나감',3],['물질은 분해자를 거쳐 다시 생산자가 이용',2]],2)],
h4a:[W('short','방사성 동위 원소를 이용해 암석의 절대 연령을 구할 수 있는 원리를 서술하시오.','방사성 동위 원소는 온도나 압력에 관계없이 일정한 반감기로 붕괴한다. 암석 속 모원소와 자원소의 비율을 측정하면 경과한 반감기 수를 알 수 있어 절대 연령을 계산할 수 있다.',[['반감기가 일정함(외부 조건에 무관)',2],['모원소와 자원소의 비율 측정',2],['경과한 반감기 수로 연령 계산',1]],2)],
h4b:[W('short','태풍이 육지에 상륙하면 세력이 약해지는 까닭을 서술하시오.','태풍의 에너지원은 따뜻한 바다에서 증발한 수증기가 응결할 때 내놓는 숨은열인데, 육지에서는 수증기 공급이 줄어든다. 또 지표면과의 마찰이 커져 세력이 약해진다.',[['에너지원인 수증기(숨은열) 공급 감소',3],['지표면 마찰 증가',2]],2),
 W('essay','엘니뇨가 발생했을 때 동태평양과 서태평양 적도 부근에서 나타나는 변화를 대기와 해양의 상호 작용으로 논술하시오.','평상시에는 무역풍이 따뜻한 표층 해수를 서쪽으로 이동시켜 서태평양은 수온이 높고 상승 기류가 발달해 비가 많고, 동태평양은 용승으로 수온이 낮다. 엘니뇨 때는 무역풍이 약해져 따뜻한 해수가 동쪽으로 퍼지고 동태평양의 용승이 약해져 수온이 높아진다. 그 결과 상승 기류 지역이 동쪽으로 이동해 동태평양 연안은 강수량이 늘어 홍수가 잦아지고, 서태평양은 하강 기류로 가뭄과 산불이 잦아진다. 또 영양염 공급이 줄어 페루 연안 어획량이 감소한다.',[['평상시 무역풍·해수 이동·용승 구조',2],['엘니뇨 시 무역풍 약화와 동태평양 수온 상승·용승 약화',3],['대기 변화(상승 기류 이동)와 지역별 강수 변화',3],['논리적 구성과 정확한 과학 용어',2]],4)],
h4c:[W('short','허블 법칙이 우주 팽창의 증거가 되는 까닭을 서술하시오.','멀리 있는 은하일수록 스펙트럼의 적색 편이가 커서 더 빠르게 멀어진다. 어느 방향을 보아도 은하들이 거리에 비례하는 속도로 서로 멀어지는 것은 우주 공간 자체가 팽창하기 때문이다.',[['먼 은하일수록 적색 편이가 큼(후퇴 속도가 거리에 비례)',3],['은하들이 서로 멀어지는 것은 우주가 팽창하기 때문',2]],2),

function fixJSON(s){return s.replace(/\\\\|\\(?:(?=[A-Za-z]{2})(?!u[0-9a-fA-F]{4})|(?=[^"\\/bfnrtu]))/g,m=>m.length===2?m:'\\\\')}
function parseLoose(t){
  t=String(t||'').trim();const f=t.match(/```(?:json)?\s*([\s\S]*?)```/);if(f)t=f[1].trim();
  const tries=[t];const i=Math.min(...['{','['].map(c=>{const k=t.indexOf(c);return k<0?1e9:k})),j=Math.max(t.lastIndexOf('}'),t.lastIndexOf(']'));
  if(i<1e9&&j>i)tries.push(t.slice(i,j+1));
  for(const s of tries)for(const x of[fixJSON(s),s]){try{return JSON.parse(x)}catch(e){}}
  throw{code:'invalid_json',text:t};
}

const ORDER=['ox','match','mc','box','fill','short','essay'];
const isMC=t=>t==='mc'||t==='box';

const ROMAN=['Ⅰ','Ⅱ','Ⅲ','Ⅳ','Ⅴ','Ⅵ','Ⅶ'];

function typeCounts(n,types){
  let t=ORDER.filter(x=>types.includes(x));if(!t.length)return{};
  if(t.length>n){const keep=['mc','ox','fill','box','short','match','essay'].filter(x=>t.includes(x)).slice(0,n);t=ORDER.filter(x=>keep.includes(x))}
  if(t.length===1)return{[t[0]]:n};
  const w={ox:3,match:1,mc:6,box:2,fill:3,short:3,essay:1.4},sum=t.reduce((a,x)=>a+w[x],0),out={};
  t.forEach(x=>out[x]=Math.max(1,Math.round(n*w[x]/sum)));
  let tot=t.reduce((a,x)=>a+out[x],0);const pri=['mc','ox','fill','box','short','match','essay'].filter(x=>t.includes(x));
  while(tot>n){const k=[...t].sort((a,b)=>out[b]-out[a])[0];if(out[k]<=1)break;out[k]--;tot--}
  while(tot<n){out[pri[0]]++;tot++}
  return out;
}
function fromStatic(id,s){
  let c=s.c.slice(),a=s.a;
  if(!s.b&&!c.some(x=>/^[ㄱㄴㄷ](,|$)/.test(x))){const idx=shuffle([0,1,2,3,4]);c=idx.map(i=>s.c[i]);a=idx.indexOf(s.a)}
  return{type:'mc',q:s.q,box:s.b||[],data:'',choices:c,answer:a,exp:s.e,unit:unitLabel(id),concept:'',pts:TYPES.mc.pts};
}
function fromGen(id,r){return{type:'mc',q:r.q,box:r.b||[],data:r.data||'',choices:r.c,answer:r.a,exp:r.e,unit:unitLabel(id),concept:r.concept||'',pts:TYPES.mc.pts}}
function genToFill(id,r){
  if(r.noFill||(r.num==null&&r.ans!=null&&/[$\\]/.test(r.ans)))return null;
  if(r.num!=null){const u=(r.unit||'').trim();return{type:'fill',q:r.q+(u?` (단위: ${u})`:''),data:r.data||'',box:[],accept:[r.ans!=null&&/[$\\]/.test(r.ans)?r.ans:fmt(r.num)+(u?' '+u:'')],num:r.num,exp:r.e,unit:unitLabel(id),concept:r.concept||'',pts:TYPES.fill.pts}}
  if(r.ans!=null)return{type:'fill',q:r.q,data:r.data||'',box:[],accept:[r.ans],num:null,exp:r.e,unit:unitLabel(id),concept:r.concept||'',pts:TYPES.fill.pts};
  return null;
}
function fromW(id,w){return{type:w.type,q:w.q,box:[],data:'',model:w.ans,rubric:w.rub.map(([c,p])=>({c,p})),exp:'',unit:unitLabel(id),concept:'',pts:TYPES[w.type].pts}}
function fromOX(id,o){return{type:'ox',q:o[0],answer:!!o[1],exp:o[2]||'',box:[],data:'',unit:unitLabel(id),concept:'',pts:TYPES.ox.pts}}
function fromMatch(id,m){return{type:'match',q:'왼쪽 항목과 관련 있는 것을 오른쪽에서 찾아 선으로 연결하시오.',left:m.map(p=>p[0]),right:m.map(p=>p[1]),rOrder:shuffle(m.map((p,i)=>i)),exp:'',box:[],data:'',unit:unitLabel(id),concept:'',pts:TYPES.match.pts}}
function fromFill(id,f){return{type:'fill',q:f.q,accept:f.acc,num:f.num??null,exp:f.e,box:[],data:'',unit:unitLabel(id),concept:'',pts:TYPES.fill.pts}}
function buildBank(ids,diff,n,types){
  const want=typeCounts(n,types),out={},notes=[],target=Math.min(diff,4),gens=ids.filter(id=>GEN[id]);
  for(const t of ORDER){if(!want[t])continue;const k=want[t];let got=[];
    if(t==='mc'){
      const pool=[];for(const id of ids)for(const s of(BANK[id]||[])){if(s.b&&want.box)continue;pool.push({id,s,w:Math.abs(s.d-target)+Math.random()*1.3})}
      pool.sort((a,b)=>a.w-b.w);
      let nGen=gens.length?Math.max(1,Math.round(k*Math.min(.6,.2+.5*gens.length/ids.length))):0;
      let nSt=gens.length?Math.min(pool.length,k-nGen):Math.min(pool.length,k);
      got=pool.slice(0,nSt).map(p=>fromStatic(p.id,p.s));const seen=new Set(got.map(q=>q.q));let tries=0;
      while(got.length<k&&gens.length&&tries<k*15){tries++;const id=gens[tries%gens.length];const r=pick(GEN[id])(diff);if(seen.has(r.q))continue;seen.add(r.q);got.push(fromGen(id,r))}
      got=shuffle(got);
    }else if(t==='box'){
      const pool=[];for(const id of ids)for(const s of(BANK[id]||[]))if(s.b)pool.push(Object.assign(fromStatic(id,s),{type:'box'}));got=shuffle(pool).slice(0,k);
    }else if(t==='ox'){
      const pool=[];for(const id of ids)for(const o of(OXB[id]||[]))pool.push(fromOX(id,o));got=shuffle(pool).slice(0,k);
    }else if(t==='match'){
      got=shuffle(ids.filter(id=>MATB[id])).slice(0,k).map(id=>fromMatch(id,MATB[id]));
    }else if(t==='fill'){
      const st=shuffle(ids.filter(id=>FILB[id]).map(id=>fromFill(id,FILB[id])));
      const half=gens.length?Math.ceil(k/2):0;got=st.slice(0,Math.max(k-half,Math.min(st.length,k-Math.min(half,k))));
      const seen=new Set(got.map(q=>q.q));let tries=0;
      while(got.length<k&&gens.length&&tries<k*20){tries++;const id=gens[tries%gens.length];const f=genToFill(id,pick(GEN[id])(diff));if(!f||seen.has(f.q))continue;seen.add(f.q);got.push(f)}
      if(got.length<k)for(const q of st)if(got.length<k&&!seen.has(q.q)){seen.add(q.q);got.push(q)}
      got=shuffle(got);
    }else{
      const pool=[];for(const id of ids)for(const w of(WBANK[id]||[]))if(w.type===t)pool.push({id,w,s:Math.abs(w.d-target)+Math.random()*1.5});
      pool.sort((a,b)=>a.s-b.s);got=pool.slice(0,k).map(p=>fromW(p.id,p.w));
    }
    if(got.length<k)notes.push(got.length?`${TYPES[t].name}은 선택한 단원 문제은행에 ${got.length}문항뿐이라 그만큼만 냈어요`:`선택한 단원 문제은행에는 ${TYPES[t].name} 문항이 없어요`);
    out[t]=got}
  return{qs:ORDER.flatMap(t=>out[t]||[]),notes};
}

function normAI(o){
  if(!o||typeof o!=='object'||!o.q)return null;
  const t=TYPES[o.type]?o.type:'mc';
  const base={type:t,q:String(o.q),data:String(o.data||''),box:Array.isArray(o.box)?o.box.map(String).filter(Boolean):[],unit:String(o.unit||''),concept:String(o.concept||''),pts:TYPES[t].pts,exp:String(o.explanation||'')};
  if(o.from!=null&&Number(o.from)>0)base.from=Number(o.from);
  if(isMC(t)){if(!Array.isArray(o.choices)||o.choices.length!==5)return null;if(t==='box'&&base.box.length<2)base.type='mc';let a=o.answer;if(typeof a==='string'){const k=CN.indexOf(a.trim());a=k>=0?k+1:parseInt(a,10)}a=Number(a)-1;if(!(a>=0&&a<5))return null;
    return Object.assign(base,{choices:o.choices.map(c=>String(c).replace(/^[①②③④⑤]\s*/,'')),answer:a})}
  if(t==='ox'){const a=String(o.answer).trim().toUpperCase();if(!['O','X','TRUE','FALSE','참','거짓'].includes(a))return null;return Object.assign(base,{answer:a==='O'||a==='TRUE'||a==='참'})}
  if(t==='match'){const L=Array.isArray(o.left)?o.left.map(String):[],R=Array.isArray(o.right)?o.right.map(String):[];if(L.length<3||L.length>5||L.length!==R.length)return null;
    return Object.assign(base,{left:L,right:R,rOrder:shuffle(L.map((x,i)=>i))})}
  if(t==='fill'){const ans=String(o.answer??'').trim();if(!ans)return null;const acc=[ans,...(Array.isArray(o.accept)?o.accept.map(String):[])];
    const num=(o.number!=null&&o.number!==''&&isFinite(Number(o.number)))?Number(o.number):null;const ut=String(o.unitText||'').trim();
    return Object.assign(base,{accept:acc,num,numUnit:ut})}
  const rub=Array.isArray(o.rubric)?o.rubric.map(r=>({c:String(r.c||r.criterion||''),p:Number(r.p||r.points||0)})).filter(r=>r.c&&r.p>0):[];
  if(!rub.length)return null;base.pts=rub.reduce((s,r)=>s+r.p,0);
  return Object.assign(base,{model:String(o.answer||''),rubric:rub,exp:''});
}

const normTxt=s=>String(s||'').toLowerCase().replace(/[\s·.,。()（）'"`~!?$]/g,'');
function parseNum(s){s=String(s||'').replace(/,/g,'').replace(/[−–]/g,'-');const f=s.match(/(-?\d+(?:\.\d+)?)\s*\/\s*(\d+(?:\.\d+)?)/);if(f&&Number(f[2]))return Number(f[1])/Number(f[2]);const m=s.match(/-?\d+(?:\.\d+)?/);return m?Number(m[0]):null}
function fillOK(q,a){
  if(!String(a||'').trim())return false;
  if(q.num!=null){const x=parseNum(a);if(x!=null&&Math.abs(x-q.num)<=Math.max(Math.abs(q.num)*0.01,0.005))return true}
  const n=normTxt(a);return (q.accept||[]).some(acc=>{const m=normTxt(acc);return m&&(n===m||(q.num==null&&n.replace(/(이다|입니다|임)$/,'')===m))});
}
function isAnswered(q,a){
  if(isMC(q.type)||q.type==='ox')return a!=null;
  if(q.type==='match')return !!a&&Object.keys(a).length===q.left.length;
  return String(a||'').trim()!=='';
}
function gradeQ(q,i,ex){
  const a=ex.answers[i];
  if(isMC(q.type))return a===q.answer?q.pts:0;
  if(q.type==='ox')return a===q.answer?q.pts:0;
  if(q.type==='match'){if(!a)return 0;const c=q.left.filter((x,l)=>a[l]!=null&&q.rOrder[a[l]]===l).length;return q.pts*c/q.left.length}
  if(q.type==='fill')return (ex.ovr[i]||fillOK(q,a))?q.pts:0;
  return (ex.met[i]||[]).reduce((s,k)=>s+(q.rubric[k]?q.rubric[k].p:0),0);
}
async function gradeWritten(){

${items.map(({q,i})=>`### 문항 ${i+1} (${TYPES[q.type].name}, ${q.pts}점)

  const ctl=new AbortController();gradeCtl=ctl;

    if(ex!==state.exam)return;

      ex.met[i]=(Array.isArray(r.met)?r.met:[]).map(Number).filter(k=>k>=0&&k<q.rubric.length);ex.fb[i]=String(r.feedback||'');ex.aiGraded[i]=true}

  }catch(e){if(ex!==state.exam)return;ex.grading='self';if(e&&e.code!=='cancelled')ex.gradeErr=errCopy(e&&e.code)+' 기준표를 보고 직접 채점할 수 있어요.';
    if(['not_granted','sampling_disabled'].includes(e&&e.code))aiState='none'}
  gradeCtl=null;
}
function scoreOf(ex){
  let got=0,tot=0;const by={},bt={};
  ex.questions.forEach((q,i)=>{const g=gradeQ(q,i,ex);got+=g;tot+=q.pts;
    const u=q.unit||'기타';by[u]=by[u]||{g:0,t:0};by[u].g+=g;by[u].t+=q.pts;
    bt[q.type]=bt[q.type]||{g:0,t:0,n:0,r:0};bt[q.type].g+=g;bt[q.type].t+=q.pts;bt[q.type].n++;if(g>=q.pts-1e-9)bt[q.type].r++});
  return{got,tot,pct:tot?Math.round(got/tot*100):0,by,bt};
}

function gPrompt(g){

[문제] (배점 ${g.pts}점)
${g.stem}

[모범 답안] ${g.model.trim()||'(주어지지 않음: 먼저 교육과정에 맞는 모범 답안을 직접 작성하라)'}
[채점 기준] ${g.rubric.trim()?'\n'+g.rubric.trim():`(주어지지 않음: 모범 답안의 핵심 요소로 채점 기준 2~5개를 직접 만들고, 점수 합이 ${g.pts}점이 되게 하라)`}

[학생 답안]
"""
${g.mine}
"""

[채점 원칙]
- 표현이 달라도 ${subjAdv()}으로 같은 뜻이면 인정한다. 모범 답안과 다른 접근이라도 ${subjAdv()}으로 타당하고 문제가 요구한 내용을 다 담았으면 인정한다.
- 틀린 개념, 인과 관계가 뒤바뀐 서술, 근거 없이 결론만 쓴 부분은 인정하지 않는다. 문제가 요구한 조건(예: "~와 관련지어", "~을 이용하여")을 지키지 않으면 감점한다.
- 주어진 채점 기준의 점수 합이 배점과 다르면 배점에 맞게 비율을 조정한다.
- 모범 답안이나 채점 기준 자체에 ${subjAdv()} 오류가 있으면 note에 밝히고, ${subjAdv()}으로 옳은 기준으로 채점한다.
- 실제 학교 채점처럼 엄정하게 하되, 학생에게 유리한 해석이 합리적으로 가능하면 그 가능성을 acceptReason에 적는다.

JSON 객체 하나로만 답하라:
{"score":받은 점수(0~${g.pts}, 0.5 단위),"verdict":"정답" 또는 "부분 정답" 또는 "오답","acceptable":"인정됨" 또는 "이의 제기 가능" 또는 "인정 어려움","acceptReason":"내 답이 맞다고 인정받을 수 있는지와 그 이유 2~4문장. 이의 제기 가능이면 어떤 근거로 주장할 수 있는지","criteria":[{"c":"채점 요소","p":배점,"got":받은 점수,"comment":"판단 이유 1문장"}],"match":["모범 답안과 같은 뜻으로 쓴 내용"],"missing":["빠진 내용"],"wrong":["틀리거나 부정확한 내용과 왜 틀렸는지"],"model":"모범 답안(주어졌으면 그대로, 없었으면 작성한 것)","improved":"학생 답안을 최소한으로 고쳐 만점이 되게 다시 쓴 답안","tip":"다음에 비슷한 문제를 쓸 때의 조언 1~2문장('~해요'체)","note":"모범 답안·채점 기준에 대한 참고 사항(없으면 빈 문자열)"}`;
}
function normGrade(r,g){
  if(!r||typeof r!=='object'||Array.isArray(r))return null;const arr=x=>Array.isArray(x)?x.map(String).filter(s=>s.trim()):[];
  const crit=Array.isArray(r.criteria)?r.criteria.map(c=>({c:String(c&&c.c||''),p:Number(c&&c.p)||0,got:Number(c&&c.got)||0,comment:String(c&&c.comment||'')})).filter(c=>c.c):[];
  let score=Number(r.score);if(!isFinite(score))score=crit.reduce((s,c)=>s+c.got,0);if(!isFinite(score))return null;score=Math.max(0,Math.min(g.pts,score));
  return{score,pts:g.pts,verdict:String(r.verdict||''),acceptable:String(r.acceptable||''),acceptReason:String(r.acceptReason||''),criteria:crit,match:arr(r.match),missing:arr(r.missing),wrong:arr(r.wrong),
    model:String(r.model||''),improved:String(r.improved||''),tip:String(r.tip||''),note:String(r.note||''),modelGiven:!!g.model.trim(),mine:g.mine};
}
async function runGrade(){
  if(!sample||aiState==='none'||!gReady()||state.gBusy)return;
  const g=JSON.parse(JSON.stringify(state.gForm));g.pts=Math.min(100,Math.max(1,Math.round(+g.pts)||TYPES[g.type].pts));
  state.gBusy=true;state.gErr='';state.gRes=null;keepScroll();document.getElementById('gres')?.scrollIntoView({block:'center',behavior:'smooth'});
  const ctl=new AbortController();gCtl=ctl;

  catch(e){const c=e&&e.code;if(c!=='cancelled')state.gErr=c==='invalid_json'?'채점 결과를 읽지 못했어요. 다시 채점해 주세요.':errCopy(c);if(['not_granted','sampling_disabled'].includes(c))aiState='none'}
  state.gBusy=false;gCtl=null;
  if(state.view==='setup'&&state.tab==='grade'){keepScroll();document.getElementById('gres')?.scrollIntoView({block:'start',behavior:'smooth'})}
}

function recMinutes(){const want=typeCounts(state.count,state.types),per={ox:.5,match:2,mc:1.5,box:2,fill:1,short:4,essay:10};let m=0;for(const k in want)m+=want[k]*(per[k]||1.5);m*=1+0.2*(state.diff-2);return Math.max(5,Math.round(m/5)*5)}
function timeStep(n){
  const rec=recMinutes(),opts=[0,10,20,30,45,50];
  return`<div class="step"><div class="step-n">${n}</div><div class="step-body"><h3>시간 제한</h3>
   <div class="chips" style="margin-top:0">${opts.map(m=>`<button class="chip" data-act="tl" data-v="${m}" aria-pressed="${!state.tcustom&&state.tlimit===m}">${m?m+'분':'제한 없음'}</button>`).join('')}${opts.includes(rec)?'':`<button class="chip" data-act="tl" data-v="rec" aria-pressed="${!state.tcustom&&state.tlimit===rec}">추천 ${rec}분</button>`}<button class="chip" data-act="tl" data-v="custom" aria-pressed="${!!state.tcustom}">직접 정하기</button></div>
   ${state.tcustom?`<div class="cf-row" style="margin-top:10px;max-width:220px"><input class="cf-in" type="number" id="tl-custom" data-act="tlc" min="1" max="180" step="1" value="${state.tlimit||''}" inputmode="numeric" aria-label="시간 제한(분)" placeholder="예) 25"><span class="lbl2">분</span></div>`:''}
   <p class="diff-desc" id="tl-desc">${tlDesc(rec)}</p>
  </div></div>`;
}
function tlDesc(rec){return(state.tlimit?`${state.tlimit}분이 지나면 자동으로 제출돼요.`:'시간 제한 없이 걸린 시간만 재요.')+` 시험 중에 일시정지할 수 있어요. 이 구성의 추천 시간은 ${rec}분이에요.`}
function elapsed(ex){if(!ex.start)return 0;const now=ex.end||(ex.paused?ex.pauseAt:Date.now());return Math.max(0,now-ex.start-(ex.pausedMs||0))}
function remain(ex){return ex.limit?ex.limit-elapsed(ex):null}
function clockText(ex){const r=remain(ex);return r==null?`경과 ${mmss(elapsed(ex))}`:`남은 시간 ${mmss(Math.max(0,r))}`}
function tick(){
  const ex=state.exam;if(!ex||ex.submitted||state.view!=='exam')return;const r=remain(ex);
  for(const id of['clock','clock2','clock3']){const c=document.getElementById(id);if(c){c.textContent=clockText(ex);c.classList.toggle('low',r!=null&&r<=60000)}}
  if(r!=null&&r<=0&&!ex.paused&&ex.start){ex.timeUp=true;if(genCtl)genCtl.abort();submitExam()}
}
function togglePause(ex){
  if(!ex||ex.submitted)return;
  if(!ex.paused){ex.paused=true;ex.pauseAt=Date.now()}
  else{if(ex.start)ex.pausedMs=(ex.pausedMs||0)+Math.max(0,Date.now()-Math.max(ex.pauseAt,ex.start));ex.paused=false}
  state.submitAsk=false;keepScroll();
}

function lvlBank(L,units,used){
  const d=Math.min(DIFF.length,Math.max(1,Math.round(L))),gens=units.filter(id=>GEN[id]);
  const st=[];for(const id of units)for(const s of(BANK[id]||[]))if(!used.has(s.q))st.push({id,s,w:Math.abs(s.d-L)});
  st.sort((a,b)=>a.w-b.w);const best=st.length?st[0].w:9;
  if(gens.length&&(L>=4.3||best>0.75||Math.random()<.35)){for(let k=0;k<25;k++){const id=pick(gens),r=pick(GEN[id])(d);if(!used.has(r.q)){used.add(r.q);return fromGen(id,r)}}}
  if(st.length){const c=pick(st.filter(x=>x.w<=best+0.01));used.add(c.s.q);return fromStatic(c.id,c.s)}
  return null;
}
async function genLevelQ(L,signal){

  const unit=pick(lt.units);
  const prev=lt.hist.map(h=>h.q).concat(lt.curQ?[lt.curQ]:[]);
  const avoid=prev.map(q=>q.concept||q.q.slice(0,30)).slice(-12);
  const o=await askJSON(lvlPrompt(L,unit,avoid),{signal,cache:false,modelTier:L>=4?'complex':'default'});
  const q=normAI(Array.isArray(o)?o[0]:o);
  if(!q||(!isMC(q.type)&&q.type!=='fill'))throw{code:'invalid_json'};
  q.unit=q.unit||unitLabel(unit);return q;
}

  history.unshift({id:Math.random().toString(36).slice(2),subj:state.subject,scope:scopeLabel(lt.units),diff:'레벨 테스트 '+lt.total+'문항',mode:lt.mode==='ai'?'AI':'문제은행',pct:'Lv '+lv1(lt.final),date:`${d.getMonth()+1}/${d.getDate()} ${String(d.getHours()).padStart(2,'0')}:${String(d.getMinutes()).padStart(2,'0')}`});saveHist();
}
function meterHTML(lt){
  const c=lt.done?lt.final:lt.curL;
  return`<div class="meter" role="img" aria-label="레벨 범위 ${fmt(lt.lo)}~${fmt(lt.hi)}, 현재 ${fmt(c)}"><div class="mtrack"><div class="mband" style="left:${lvPos(lt.lo)}%;width:${lvPos(lt.hi)-lvPos(lt.lo)}%"></div><div class="mmark" style="left:${lvPos(c)}%"></div></div>
   <div class="mticks">${DIFF.map((d,k)=>`<span style="left:${lvPos(k+1)}%">${k+1} ${d.name}</span>`).join('')}</div></div>`;
}
function chartHTML(lt){
  const H=lt.hist;if(!H.length)return'';
  const W=320,Ht=150,l=34,r=14,t=10,b=22,n=H.length+(lt.done?1:0);
  const x=k=>l+(n>1?k*(W-l-r)/(n-1):(W-l-r)/2),y=L=>t+(LVL_HI-L)/(LVL_HI-LVL_LO)*(Ht-t-b);
  let g='';for(let L=1;L<=LVL_HI;L++)g+=`<line x1="${l}" x2="${W-r}" y1="${y(L)}" y2="${y(L)}" style="stroke:var(--rule);stroke-width:1"/><text x="${l-8}" y="${y(L)+4}" text-anchor="end" style="fill:var(--muted);font-size:10px">${L}</text>`;
  const pts=H.map((h,k)=>[x(k),y(h.L)]);if(lt.done)pts.push([x(H.length),y(lt.final)]);
  g+=`<polyline points="${pts.map(p=>p.join(',')).join(' ')}" style="fill:none;stroke:var(--ink);stroke-width:1.6;stroke-linejoin:round"/>`;
  H.forEach((h,k)=>{g+=`<circle cx="${x(k)}" cy="${y(h.L)}" r="5" style="fill:${h.ok?'var(--ok)':'var(--pen)'};stroke:var(--paper);stroke-width:1.5"/><text x="${x(k)}" y="${Ht-6}" text-anchor="middle" style="fill:var(--muted);font-size:9.5px">${k+1}</text>`});
  if(lt.done)g+=`<circle cx="${x(H.length)}" cy="${y(lt.final)}" r="6" style="fill:var(--paper);stroke:var(--omr);stroke-width:2.5"/><text x="${x(H.length)}" y="${Ht-6}" text-anchor="middle" style="fill:var(--omr);font-size:9.5px;font-weight:700">결과</text>`;
  return`<svg class="lvchart" viewBox="0 0 ${W} ${Ht}" role="img" aria-label="문항별 레벨 변화. 초록은 맞힘, 빨강은 틀림">${g}</svg>`;
}
function renderLevel(){
  const lt=state.level;if(!lt){state.view='setup';return renderSetup()}
  const ex=state.exam,okAI=!!sample&&aiState!=='none';
  const header=`<header class="top"><div class="brand"><span class="seal">${state.subject==='math'?'수':'과'}</span><div><h1>${subjName()} 단원평가실</h1><p>레벨 테스트 · ${esc(scopeLabel(lt.units))}</p></div></div><div>${lt.done?`<button class="ghost" data-act="lhome">설정으로</button>`:lt.quitAsk?`<span class="note">레벨 테스트를 그만둘까요? </span><button class="ghost" data-act="lquit-yes">그만두기</button> <button class="ghost" data-act="lquit-no">계속</button>`:`<button class="ghost" data-act="lquit">그만두기</button>`}</div></header>`;
  if(lt.done){document.getElementById('app').innerHTML=header+levelResultHTML(lt,okAI);return}
  let body;
  if(lt.err)body=`<div class="gen"><span class="err">${esc(lt.err)}</span><button class="ghost" data-act="lretry">다시 출제</button>${lt.mode==='ai'?'<button class="ghost" data-act="lbank">문제은행으로 계속</button>':''}</div>`;
  else if(lt.loading||!ex)body=`<div class="lv-load"><span class="dot"></span><span>레벨 ${fmt(lt.curL)} (${esc(lvDesc(lt.curL))}) 문제를 ${lt.mode==='ai'?'출제하고':'고르고'} 있어요${lt.mode==='ai'&&lt.curL>=4?'. 높은 난이도는 1분 안팎 걸릴 수 있어요':''}</span></div>`;
  else{
    const h=lt.answered?lt.hist[lt.hist.length-1]:null;
    body=`<ol class="qs one">${qHTML(ex.questions[lt.idx],lt.idx,ex)}</ol>`+(h
      ?`<div class="lv-ctrl"><span style="font-weight:600;color:${h.ok?'var(--ok)':'var(--pen)'}">${h.ok?'맞혔어요. 레벨을 올려요.':h.gave?'모르는 문제라 레벨을 내려요.':'틀렸어요. 레벨을 내려요.'}</span><span class="note">범위 ${fmt(lt.lo)} ~ ${fmt(lt.hi)}</span><button class="btn sm" data-act="lnext">${lt.hist.length>=lt.total?'결과 보기':'다음 문제'}</button></div>`
      :`<div class="lv-ctrl"><button class="btn red sm" data-act="lcheck">확인</button><button class="ghost" data-act="lgiveup">모르겠어요</button>${lt.need?'<span class="err">답을 고르거나 쓴 뒤 확인을 누르세요.</span>':''}</div>`);
  }
  const step=Math.min(lt.total,lt.hist.length+(lt.answered?0:1));
  document.getElementById('app').innerHTML=header+`<div class="grid">
   <article class="paper sheet">
    <div class="sheet-head" style="text-align:left;padding-bottom:10px">
      <div class="sheet-meta"><span>레벨 테스트 · ${lt.mode==='ai'?'AI 출제':'기본 문제은행'}</span><span style="font-variant-numeric:tabular-nums">${step} / ${lt.total}</span></div>
      <h2 class="sheet-title" style="margin:6px 0 2px;font-size:24px;letter-spacing:.02em">지금 레벨 ${fmt(lt.curL)} · ${esc(lvDesc(lt.curL))}</h2>
    </div>
    ${meterHTML(lt)}
    ${body}
   </article>
   <aside class="side">
    <section class="paper card"><h3>진행 <span class="note">${lt.hist.length}/${lt.total}</span></h3>
     ${lt.hist.length?`<ul class="lvlist">${lt.hist.map((h,k)=>`<li><span class="${h.ok?'ok':'no'}">${h.ok?'O':'X'}</span><span>${k+1}번 · ${esc(lvDesc(h.L))}</span><span class="lvv">${fmt(h.L)}</span></li>`).join('')}</ul>${chartHTML(lt)}`:'<p class="empty">문제를 풀면 여기에 기록돼요.</p>'}
    </section>
    <section class="paper card"><h3>이분 탐색</h3><p class="note" style="margin:0">맞히면 지금 레벨과 위쪽 끝의 가운데로, 틀리면 아래쪽 끝과의 가운데로 옮겨요. 범위가 반씩 줄고 마지막 범위의 가운데가 내 레벨이에요.</p></section>
   </aside></div>`;
  drawLines();
}
function levelResultHTML(lt,okAI){
  const L=lt.final,rec=Math.min(DIFF.length,Math.max(1,Math.round(L))),okN=lt.hist.filter(h=>h.ok).length,wrongN=lt.total-okN;
  return`<div class="grid"><article class="paper sheet">
   <span class="eyebrow">레벨 테스트 결과</span>
   <div style="display:flex;gap:18px;align-items:flex-end;flex-wrap:wrap;margin-top:8px"><div class="lvbig">${lv1(L)}<small> / ${LVL_HI}</small></div>
    <div style="min-width:0"><div style="font-family:var(--f-paper);font-size:22px;font-weight:700">${esc(lvDesc(L))}</div><div class="note">${esc(scopeLabel(lt.units))} · ${lt.total}문항 중 ${okN}문항 맞힘 · ${mmss(lt.end-lt.start)}</div></div></div>
   ${meterHTML(lt)}
   ${chartHTML(lt)}
   <div class="lvrev">${lt.hist.map((h,k)=>{const tmp=newExam({submitted:true,noPick:true});tmp.questions[k]=h.q;tmp.answers[k]=h.a;tmp.ovr[k]=h.ok&&h.q.type==='fill'&&!fillOK(h.q,h.a);
     return`<details><summary><span class="${h.ok?'ok':'no'}">${h.ok?'O':'X'}</span><span>${k+1}번 · 레벨 ${fmt(h.L)} (${esc(lvDesc(h.L))})${h.gave?' · 모르겠어요':''}</span></summary><ol class="qs one">${qHTML(h.q,k,tmp).replace(/data-act="ovr"/g,'data-act="noop" hidden')}</ol></details>`}).join('')}</div>
  </article>
  <aside class="side"><section class="paper res">
   <h3 style="font-size:14px;margin-bottom:8px">다음 단계</h3>
   <p class="note" style="margin:0 0 4px">내 레벨에 가장 가까운 난이도는 <b>${DIFF[rec-1].name}</b>이에요.</p>
   <div class="res-actions">
    <button class="btn sm" data-act="lexam" data-v="${rec}">${DIFF[rec-1].name} 난이도로 단원 시험 보기</button>
    ${wrongN?`<button class="btn red sm" data-act="lsim" ${okAI?'':'disabled'}>틀린 ${wrongN}문항 유사 문항 · ${wrongN*2}문항</button>`:''}
    ${okN?`<button class="ghost" data-act="ldeep" ${okAI?'':'disabled'}>맞힌 ${okN}문항 심화 유형</button>`:''}
    <button class="ghost" data-act="lagain">레벨 테스트 다시 하기</button>
    <button class="ghost" data-act="lhome">설정으로</button>
   </div>${okAI?'':'<p class="note">유사 문항과 심화 유형은 AI가 필요해요.</p>'}</section></aside></div>`;
}
function levelSrc(lt,ok){return lt.hist.map((h,k)=>({q:h.q,n:k+1,a:h.a,g:h.ok?h.q.pts:0,ok:h.ok})).filter(s=>s.ok===ok)}

/* ===================== 동작 ===================== */
function keepScroll(){const y=window.scrollY;render();window.scrollTo(0,y)}
function newExam(o){return Object.assign({subj:state.subject,units:[],diff:2,count:10,types:[],mode:'bank',questions:[],answers:{},met:{},fb:{},aiGraded:{},ovr:{},start:0,end:0,submitted:false,grading:'',generating:false,notes:[]},o)}
function startExam(mode){
  const ids=state.sel.slice();state.err='';state.quitAsk=false;state.submitAsk=false;mSel=null;
  const lvs=new Set(ids.map(id=>U[id].lv));if(lvs.size>1){state.err='중학교와 고등학교 단원을 함께 고를 수 없어요. 한 학교급만 남겨 주세요.';return render()}
  const ex=newExam({units:ids,diff:state.diff,count:state.count,types:state.types.slice(),mode,limit:(state.tlimit||0)*60000});
  state.exam=ex;state.view='exam';
  if(mode==='ai'&&sample&&aiState!=='none'){render();window.scrollTo(0,0);genAI()}
  else{const r=buildBank(ids,state.diff,state.count,state.types);ex.questions=r.qs;ex.notes=r.notes;ex.count=r.qs.length||state.count;ex.mode='bank';ex.start=Date.now();
    if(!r.qs.length)ex.genErr='선택한 단원과 유형으로 낼 수 있는 문제은행 문항이 없어요. 유형을 바꾸거나 AI 출제를 쓰세요.';
    render();window.scrollTo(0,0)}
}
async function submitExam(){
  const ex=state.exam;ex.submitted=true;ex.end=Date.now();state.submitAsk=false;mSel=null;
  const p=gradeWritten();render();window.scrollTo(0,0);await p;
  if(ex!==state.exam)return;render();recordHistory(ex);
}
function recordHistory(ex){
  const sc=scoreOf(ex);const d=new Date();
  const entry={id:ex.id||(ex.id=Math.random().toString(36).slice(2)),subj:ex.subj||state.subject,scope:exScope(ex),diff:dName(ex.diff),mode:ex.mode==='ai'?'AI':ex.mode==='similar'?(ex.kind==='deep'?'심화':'유사'):ex.mode==='retry'?'오답':'문제은행',pct:sc.pct,date:`${d.getMonth()+1}/${d.getDate()} ${String(d.getHours()).padStart(2,'0')}:${String(d.getMinutes()).padStart(2,'0')}`};
  const k=history.findIndex(h=>h.id===entry.id);if(k>=0)history[k]=entry;else history.unshift(entry);saveHist();
}
function connect(i,l,d){
  const ex=state.exam;const a=Object.assign({},ex.answers[i]||{});
  if(a[l]===d)delete a[l];else{for(const k of Object.keys(a))if(a[k]===d)delete a[k];a[l]=d}
  ex.answers[i]=a;
}
document.addEventListener('click',e=>{
  const t=e.target.closest('[data-act]');if(!t)return;const a=t.dataset.act,v=t.dataset.v;
  if(t.tagName==='INPUT'||t.tagName==='TEXTAREA')return;
  const ex=state.exam;
  switch(a){
   case'lv':state.lv=v;state.grp=GROUPS[v][0];state.sel=state.sel.filter(id=>U[id].lv===v);savePrefs();render();break;
   case'grp':state.grp=v;savePrefs();render();break;
   case'all':UNITS.filter(u=>u.lv===state.lv&&u.grp===state.grp).forEach(u=>{if(!state.sel.includes(u.id))state.sel.push(u.id)});savePrefs();render();break;
   case'none':state.sel=[];savePrefs();render();break;
   case'unpick':state.sel=state.sel.filter(x=>x!==v);savePrefs();render();break;
   case'diff':state.diff=+v;savePrefs();render();break;
   case'count':state.count=+v;savePrefs();render();break;
   case'mode':state.mode=v;render();break;
   case'start':startExam(state.mode);break;
   case'pick':{if(!ex||ex.submitted)return;const i=+t.dataset.q,o=+t.dataset.o;ex.answers[i]=ex.answers[i]===o?null:o;
     const li=document.getElementById('q-'+i);if(li)li.querySelectorAll('.opt').forEach((b,k)=>b.setAttribute('aria-checked',String(ex.answers[i]===k)));
     state.submitAsk=false;refreshOMR();break}
   case'ox':{if(!ex||ex.submitted)return;const i=+t.dataset.q,val=v==='1';ex.answers[i]=ex.answers[i]===val?null:val;
     const li=document.getElementById('q-'+i);if(li)li.querySelectorAll('.oxb').forEach(b=>{const on=ex.answers[i]===(b.dataset.v==='1');b.classList.toggle('on',on);b.setAttribute('aria-checked',String(on))});
     state.submitAsk=false;refreshOMR();break}
   case'ml':case'mr':{if(!ex||ex.submitted)return;const i=+t.dataset.q,k=+t.dataset.k,side=a==='ml'?'L':'R';
     if(mSel&&mSel.q===i&&mSel.side!==side){side==='L'?connect(i,k,mSel.k):connect(i,mSel.k,k);mSel=null}
     else if(mSel&&mSel.q===i&&mSel.side===side&&mSel.k===k)mSel=null;
     else mSel={q:i,side,k};
     refreshQ(i);document.querySelector(`#q-${i} [data-act="${a}"][data-k="${k}"]`)?.focus({preventScroll:true});state.submitAsk=false;refreshOMR();break}
   case'mclear':{const i=+t.dataset.q;ex.answers[i]={};mSel=null;refreshQ(i);refreshOMR();break}
   case'ovr':{if(!ex)break;const i=+t.dataset.q;ex.ovr[i]=!ex.ovr[i];
     if(state.view==='level'){const lt=state.level,h=lt.hist[lt.hist.length-1];h.ok=fillOK(h.q,h.a)||!!ex.ovr[i];lt.lo=h.lo;lt.hi=h.hi;if(h.ok)lt.lo=h.L;else lt.hi=h.L;keepScroll();break}
     const y=window.scrollY;render();window.scrollTo(0,y);recordHistory(ex);break}
   case'jump':{const i=t.dataset.q;const el=document.getElementById('ta-'+i)||document.getElementById('fi-'+i)||document.getElementById('mt-'+i)||document.getElementById('q-'+i);
     if(el){el.scrollIntoView({block:'center',behavior:'smooth'});if(el.focus&&(el.tagName==='TEXTAREA'||el.tagName==='INPUT'))el.focus({preventScroll:true})}break}
   case'submit':state.submitAsk=true;{const f=document.getElementById('omr-foot');if(f){f.innerHTML=footHTML(ex);if(window.innerWidth<=900)f.scrollIntoView({block:'center',behavior:'smooth'})}}break;
   case'submit-no':state.submitAsk=false;refreshOMR();break;
   case'submit-yes':submitExam();break;
   case'stop':genCtl&&genCtl.abort();break;
   case'stopgrade':gradeCtl&&gradeCtl.abort();break;
   case'retry':ex&&ex.mode==='similar'?startSimilar(ex.sim):startExam('ai');break;
   case'similar':startSimilar({src:wrongOf(ex),mult:+v,units:ex.units,diff:ex.diff,kind:'similar',lv:exLv(ex),title:ex.title});break;
   case'selq':{const i=+t.dataset.q;ex.chosen=ex.chosen||{};ex.chosen[i]=!ex.chosen[i];keepScroll();document.querySelector(`#q-${i} .pickq`)?.focus({preventScroll:true});break}
   case'selwrong':ex.chosen={};wrongOf(ex).forEach(w=>ex.chosen[w.n-1]=true);keepScroll();break;
   case'selall':ex.chosen={};ex.questions.forEach((q,i)=>ex.chosen[i]=true);keepScroll();break;
   case'selnone':ex.chosen={};keepScroll();break;
   case'pickmult':state.pickMult=+v;keepScroll();break;
   case'selgen':{const src=chosenOf(ex).map(i=>srcOf(ex,i));if(!src.length)break;
     startSimilar({src,mult:state.pickMult,units:ex.units,diff:v==='deep'?(ex.diff?Math.min(DIFF.length,ex.diff+1):0):ex.diff,kind:v,lv:exLv(ex),title:ex.title});break}
   case'subj':switchSubject(v);window.scrollTo(0,0);break;
   case'tab':state.tab=v;state.err='';savePrefs();render();break;
   case'pause':togglePause(ex);break;
   case'tl':{if(v==='custom'){state.tcustom=true;if(!state.tlimit)state.tlimit=recMinutes()}else{state.tcustom=false;state.tlimit=v==='rec'?recMinutes():+v}savePrefs();keepScroll();if(v==='custom'){const i=document.getElementById('tl-custom');if(i){i.focus({preventScroll:true});i.select()}}break}
   case'glv':state.gForm.lv=v;savePrefs();keepScroll();break;
   case'gtype':{const gf=state.gForm;if(gf.pts===TYPES[gf.type].pts)gf.pts=TYPES[v].pts;gf.type=v;savePrefs();keepScroll();break}
   case'gstart':runGrade();break;
   case'gstop':gCtl&&gCtl.abort();break;
   case'g2c':{const gf=state.gForm,f=cfDefault();f.stem=gf.stem;f.model=gf.model;f.rubric=gf.rubric;f.mineText=gf.mine;state.cForm=f;state.cSrcType=gf.type;state.cLv=gf.lv;state.cKind='similar';state.tab='custom';savePrefs();render();window.scrollTo(0,0);break}
   case'lcount':state.lvlCount=+v;savePrefs();render();break;
   case'lstart':startLevel();break;
   case'lcheck':lvlAnswer(false);break;
   case'lgiveup':lvlAnswer(true);break;
   case'lnext':lvlNext();break;
   case'lretry':{const lt=state.level;if(!lt)break;lvlRT.cur=makeSlot(lt.curL);showCurrent();break}
   case'lbank':{const lt=state.level;if(!lt)break;lt.mode='bank';abortLevel();lvlRT.cur=makeSlot(lt.curL);showCurrent();break}
   case'lquit':state.level.quitAsk=true;render();break;
   case'lquit-no':state.level.quitAsk=false;render();break;
   case'lquit-yes':case'lhome':abortLevel();state.level=null;state.exam=null;state.view='setup';render();window.scrollTo(0,0);break;
   case'lagain':{const lt=state.level;state.sel=lt.units.slice();state.mode=lt.mode;startLevel();break}
   case'lexam':{const lt=state.level;state.diff=+v;state.sel=lt.units.slice();state.tab='exam';state.level=null;state.exam=null;state.view='setup';savePrefs();render();window.scrollTo(0,0);break}
   case'lsim':case'ldeep':{const lt=state.level,rec=Math.min(DIFF.length,Math.max(1,Math.round(lt.final))),deep=a==='ldeep';
     startSimilar({src:levelSrc(lt,deep),mult:deep?1:2,units:lt.units,diff:deep?Math.min(DIFF.length,rec+1):rec,kind:deep?'deep':'similar',lv:U[lt.units[0]].lv});break}
   case'clv':state.cLv=v;savePrefs();render();break;
   case'ckind':state.cKind=v;savePrefs();render();break;
   case'ccount':state.cCount=+v;savePrefs();render();break;
   case'cdiff':state.cDiff=+v;savePrefs();render();break;
   case'csrc':{const f=state.cForm,prev=state.cSrcType;state.cSrcType=v||'';
     if(state.cSrcType==='box'&&f.choices.every(c=>!c.trim()))f.choices=BOXDEF.slice();
     else if(prev==='box'&&state.cSrcType!=='box'&&f.choices.every((c,k)=>c===BOXDEF[k]))f.choices=['','','','',''];
     savePrefs();keepScroll();break}
   case'cfans':{const f=state.cForm;if(isMC(state.cSrcType))f.ansIdx=f.ansIdx===+v?null:+v;else{const b=v==='1';f.ansOx=f.ansOx===b?null:b}savePrefs();keepScroll();break}
   case'cfmine':{const f=state.cForm;if(isMC(state.cSrcType))f.mineIdx=f.mineIdx===+v?null:+v;else{const b=v==='1';f.mineOx=f.mineOx===b?null:b}savePrefs();keepScroll();break}
   case'cftable':state.cForm.table=v==='on'?[['','',''],['','',''],['','','']]:null;savePrefs();keepScroll();if(v==='on')document.getElementById('cf-table-0-0')?.focus({preventScroll:true});break;
   case'cfadd':{const f=state.cForm;if(v==='box'&&f.box.length<5)f.box.push('');if(v==='pairs'&&f.pairs.length<6)f.pairs.push(['','']);
     if(v==='row'&&f.table&&f.table.length<10)f.table.push(f.table[0].map(()=>''));if(v==='col'&&f.table&&f.table[0].length<8)f.table.forEach(r=>r.push(''));savePrefs();keepScroll();break}
   case'cfdel':{const f=state.cForm;if(v==='box'&&f.box.length>2)f.box.pop();if(v==='pairs'&&f.pairs.length>2)f.pairs.pop();
     if(v==='row'&&f.table&&f.table.length>2)f.table.pop();if(v==='col'&&f.table&&f.table[0].length>2)f.table.forEach(r=>r.pop());savePrefs();keepScroll();break}
   case'ctype':{if(!v)state.cTypes=[];else state.cTypes=state.cTypes.includes(v)?state.cTypes.filter(x=>x!==v):[...state.cTypes,v];savePrefs();render();break}
   case'cstart':{if(!cReady())break;startSimilar({src:[{text:cToText()}],count:state.cCount,mult:state.cCount,units:[],diff:state.cDiff,kind:state.cKind,lv:state.cLv,title:'입력한 문제',custom:true,ctypes:state.cTypes.slice(),srcType:state.cSrcType});break}
   case'tobank':startExam('bank');break;
   case'quit':state.quitAsk=true;renderExam();break;
   case'quit-no':state.quitAsk=false;renderExam();break;
   case'quit-yes':genCtl&&genCtl.abort();state.exam=null;state.view='setup';state.quitAsk=false;render();break;
   case'home':gradeCtl&&gradeCtl.abort();state.exam=null;state.view='setup';render();window.scrollTo(0,0);break;
   case'again':ex.mode==='similar'?startSimilar(ex.sim):startExam(ex.mode==='retry'?'bank':ex.mode);break;
   case'retrywrong':{const qs=ex.questions.filter((q,i)=>AUTO(q.type)&&gradeQ(q,i,ex)<q.pts-1e-9).map(q=>{const c=Object.assign({},q);if(c.type==='match')c.rOrder=shuffle(c.left.map((x,k)=>k));return c});
     state.exam=newExam({units:ex.units,diff:ex.diff,count:qs.length,types:[...new Set(qs.map(q=>q.type))],mode:'retry',questions:qs,start:Date.now()});state.submitAsk=false;mSel=null;render();window.scrollTo(0,0);break}
  }
});
document.addEventListener('change',e=>{
  const t=e.target;const a=t.dataset&&t.dataset.act;if(!a)return;
  if(a==='unit'){const v=t.dataset.v;if(t.checked){if(!state.sel.includes(v))state.sel.push(v)}else state.sel=state.sel.filter(x=>x!==v);savePrefs();render();document.getElementById('u-'+v)?.focus()}
  if(a==='type'){const v=t.dataset.v;if(t.checked){if(!state.types.includes(v))state.types.push(v)}else state.types=state.types.filter(x=>x!==v);savePrefs();render();document.getElementById('t-'+v)?.focus()}
  if(a==='rub'){const ex=state.exam;const i=+t.dataset.q,k=+t.dataset.k;const s=new Set(ex.met[i]||[]);t.checked?s.add(k):s.delete(k);ex.met[i]=[...s].sort();
    const y=window.scrollY;render();window.scrollTo(0,y);document.getElementById(`rb-${i}-${k}`)?.focus({preventScroll:true});recordHistory(ex)}
});
document.addEventListener('input',e=>{
  const t=e.target;const act=t.dataset&&t.dataset.act;
  if(act==='gf'){const k=t.dataset.f;state.gForm[k]=k==='pts'?(Math.round(+t.value)||''):t.value;savePrefs();gUpdate();return}
  if(act==='tlc'){const m=Math.round(+t.value);state.tlimit=m>=1&&m<=180?m:0;savePrefs();const d=document.getElementById('tl-desc');if(d)d.textContent=tlDesc(recMinutes());return}
  if(act==='cf'){const path=t.dataset.f.split('.');let o=state.cForm;for(let k=0;k<path.length-1&&o;k++)o=o[path[k]];if(o){o[path[path.length-1]]=t.value;savePrefs();cUpdate()}return}
  if(act!=='write'&&act!=='fill')return;
  const ex=state.exam;if(!ex||ex.submitted)return;const i=+t.dataset.q;ex.answers[i]=t.value;state.submitAsk=false;
  if(act==='write'){const c=document.getElementById('tc-'+i);if(c)c.textContent=t.value.length+'자'}
  const w=document.querySelector(`.wchip[data-q="${i}"]`);if(w)w.classList.toggle('f',!!t.value.trim());
  updateCounts();
});
document.addEventListener('keydown',e=>{if(e.key==='Enter'&&e.target.dataset&&e.target.dataset.act==='fill'){e.preventDefault();if(state.view==='level'){lvlAnswer(false);return}const all=[...document.querySelectorAll('.fillin,.ta')];const k=all.indexOf(e.target);if(all[k+1])all[k+1].focus()}});

/* hot update: keep an exam in progress */
function boot(data){
  if(data&&data.state){try{Object.assign(state,data.state);applySubject(state.subject||'sci');if(state.subject==='math')ensureMJ();if(state.exam){state.exam=newExam(state.exam);if(state.exam.generating){state.exam.generating=false;state.exam.genNote='페이지가 업데이트되어 출제가 멈췄어요.'}if(state.exam.grading==='busy')state.exam.grading='self'}if(state.view==='level'&&state.level&&!state.level.done){const lt=state.level;lvlRT={cur:null,pre:null};if(!state.exam||lt.loading){lt.loading=false;lt.err='페이지가 업데이트되어 문제를 다시 받아야 해요.'}}}catch(e){}}
  render();
}
try{window.claude?.hot?.snapshot?.(()=>({state:JSON.parse(JSON.stringify(state))}))}catch(e){}
window.claude?.hot?.ready?window.claude.hot.ready(boot):boot(window.claude?.hot?.data??{});
</script>
