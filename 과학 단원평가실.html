<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>과학 단원평가실</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@400;700&family=IBM+Plex+Sans+KR:wght@400;500;600;700&family=Nanum+Pen+Script&display=swap" rel="stylesheet">
<style>
/* Layout: a test paper on a desk — request form + record card; exam sheet + OMR answer card; red-pen grading */
:root{
  --desk:#E2E6EA; --paper:#FCFCFA; --ink:#1B2330; --muted:#5D6775; --rule:#CDD3DA; --rule-strong:#1B2330;
  --omr:#C42F4D; --omr-soft:#F7E0E5; --pen:#D9271C; --ok:#2B7A4B; --chip:#EDF0F3; --focus:#2F5FD0;
  --shadow:0 1px 0 rgba(27,35,48,.06), 0 18px 40px -26px rgba(27,35,48,.45);
  --f-paper:'Gowun Batang','Noto Serif KR','Apple SD Gothic Neo',serif;
  --f-ui:'IBM Plex Sans KR',system-ui,-apple-system,'Apple SD Gothic Neo','Malgun Gothic',sans-serif;
  --f-pen:'Nanum Pen Script','Gowun Batang',cursive;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --desk:#0F1318; --paper:#181D24; --ink:#E4E8EE; --muted:#9AA4B1; --rule:#2D3541; --rule-strong:#C9D0DA;
  --omr:#EE7089; --omr-soft:#3A2029; --pen:#FF5E52; --ok:#5DC98D; --chip:#222933; --focus:#86A6FF;
  --shadow:0 1px 0 rgba(0,0,0,.3), 0 18px 40px -24px rgba(0,0,0,.8); color-scheme:dark}}
:root[data-theme="dark"]{
  --desk:#0F1318; --paper:#181D24; --ink:#E4E8EE; --muted:#9AA4B1; --rule:#2D3541; --rule-strong:#C9D0DA;
  --omr:#EE7089; --omr-soft:#3A2029; --pen:#FF5E52; --ok:#5DC98D; --chip:#222933; --focus:#86A6FF;
  --shadow:0 1px 0 rgba(0,0,0,.3), 0 18px 40px -24px rgba(0,0,0,.8); color-scheme:dark}

*{box-sizing:border-box}
body{background:var(--desk);color:var(--ink);font-family:var(--f-ui);font-size:15px;line-height:1.6;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 96px}
button,input,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
.wrap{max-width:1180px;margin:0 auto}
h1,h2,h3{text-wrap:balance;margin:0}

/* header */
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;padding-block:22px 18px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:12px}
.seal{width:40px;height:40px;border:2px solid var(--omr);color:var(--omr);border-radius:50%;display:grid;place-items:center;
  font-family:var(--f-paper);font-weight:700;font-size:19px;transform:rotate(-8deg)}
.brand h1{font-family:var(--f-paper);font-size:22px;letter-spacing:-.01em}
.brand p{margin:0;color:var(--muted);font-size:13px}
.ghost{background:none;border:1px solid var(--rule);border-radius:8px;padding:7px 12px;font-size:13.5px}
.ghost:hover{border-color:var(--ink)}

/* paper */
.paper{background:var(--paper);box-shadow:var(--shadow);border-radius:3px;min-width:0}
.grid{display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:24px;align-items:start}
@media (max-width:900px){.grid{grid-template-columns:minmax(0,1fr)}}

/* setup form */
.form{padding:28px 32px 32px}
@media (max-width:560px){.form{padding:22px 18px 24px}}
.eyebrow{font-size:12px;letter-spacing:.14em;color:var(--omr);font-weight:600}
.form-head{border-bottom:2px solid var(--rule-strong);padding-bottom:14px;margin-bottom:6px}
.form-head h2{font-family:var(--f-paper);font-size:27px;margin-top:4px}
.step{display:grid;grid-template-columns:30px minmax(0,1fr);gap:14px;padding-block:20px;border-bottom:1px solid var(--rule)}
.step:last-of-type{border-bottom:0}
.step-n{width:26px;height:26px;border-radius:50%;border:1.5px solid var(--ink);display:grid;place-items:center;font-size:13px;font-weight:600;margin-top:2px}
.step h3{font-size:16px;font-weight:600;margin-bottom:10px}
.step .hint{color:var(--muted);font-size:13px;margin:-6px 0 10px}

.seg{display:inline-flex;border:1px solid var(--rule);border-radius:9px;padding:3px;gap:3px;background:var(--chip);flex-wrap:wrap}
.seg button{border:0;background:none;padding:7px 16px;border-radius:7px;font-size:14px;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--paper);color:var(--ink);font-weight:600;box-shadow:0 1px 2px rgba(0,0,0,.12)}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:12px}
.chip{border:1px solid var(--rule);background:none;border-radius:999px;padding:5px 13px;font-size:13.5px;display:inline-flex;gap:6px;align-items:center}
.chip[aria-pressed="true"]{border-color:var(--ink);background:var(--ink);color:var(--paper)}
.chip .cnt{font-size:11.5px;background:var(--omr);color:#fff;border-radius:999px;padding:0 6px;font-weight:600}
.units{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;margin-top:12px}
@media (max-width:620px){.units{grid-template-columns:minmax(0,1fr)}}
.unit{display:flex;gap:10px;align-items:flex-start;border:1px solid var(--rule);border-radius:8px;padding:10px 12px;cursor:pointer;min-width:0}
.unit:hover{border-color:var(--muted)}
.unit input{margin-top:4px;accent-color:var(--omr);flex:none}
.unit b{font-weight:600;font-size:14.5px;display:block}
.unit small{color:var(--muted);font-size:12px;line-height:1.45;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.unit.on{border-color:var(--omr);background:var(--omr-soft)}
.unit-actions{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-top:10px;font-size:13px;color:var(--muted)}
.linkbtn{background:none;border:0;padding:2px 0;color:var(--ink);text-decoration:underline;text-underline-offset:3px;font-size:13px}
.picked{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.pk{font-size:12.5px;border-radius:6px;background:var(--chip);padding:3px 4px 3px 9px;display:inline-flex;gap:4px;align-items:center}
.pk button{border:0;background:none;color:var(--muted);padding:0 4px;font-size:14px;line-height:1}

.diffs{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:6px}
@media (max-width:620px){.diffs{grid-template-columns:repeat(2,minmax(0,1fr))}}
.diff{border:1px solid var(--rule);background:none;border-radius:8px;padding:9px 10px;text-align:left;min-width:0}
.diff b{display:block;font-size:14px}
.diff span{font-size:11.5px;color:var(--muted)}
.diff i{display:flex;gap:2px;margin-top:6px}
.diff i em{width:9px;height:9px;border-radius:50%;border:1.3px solid var(--omr)}
.diff i em.f{background:var(--omr)}
.diff[aria-pressed="true"]{border-color:var(--omr);box-shadow:inset 0 0 0 1px var(--omr);background:var(--omr-soft)}
.diff-desc{margin-top:10px;font-size:13.5px;color:var(--muted);border-left:2px solid var(--omr);padding-left:10px}

.types{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
@media (max-width:760px){.types{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:380px){.types{grid-template-columns:minmax(0,1fr)}}
.type{display:flex;gap:8px;align-items:flex-start;border:1px solid var(--rule);border-radius:8px;padding:9px 12px;cursor:pointer;min-width:0}
.type input{accent-color:var(--omr);margin-top:4px}
.type b{display:block;font-size:14px}
.type small{color:var(--muted);font-size:12px}
.type.on{border-color:var(--omr);background:var(--omr-soft)}
.mix{margin-top:8px;font-size:13px;color:var(--muted)}

.modes{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
@media (max-width:620px){.modes{grid-template-columns:minmax(0,1fr)}}
.mode{border:1px solid var(--rule);background:none;border-radius:10px;padding:12px 14px;text-align:left}
.mode b{display:block;font-size:14.5px}
.mode span{display:block;font-size:12.5px;color:var(--muted);margin-top:2px}
.mode[aria-pressed="true"]{border-color:var(--ink);box-shadow:inset 0 0 0 1px var(--ink)}
.mode:disabled{opacity:.5;cursor:not-allowed}
.go{margin-top:22px;display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.btn{border:0;background:var(--ink);color:var(--paper);border-radius:10px;padding:13px 22px;font-weight:600;font-size:15.5px}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.red{background:var(--omr);color:#fff}
.btn.sm{padding:9px 14px;font-size:14px;border-radius:8px}
.note{font-size:13px;color:var(--muted)}
.err{color:var(--pen);font-size:13.5px}

/* side cards */
.side{display:flex;flex-direction:column;gap:16px}
.card{padding:18px 18px 16px}
.card h3{font-size:14px;font-weight:600;letter-spacing:.02em;margin-bottom:10px;display:flex;justify-content:space-between;align-items:baseline}
.hist{list-style:none;margin:0;padding:0;display:flex;flex-direction:column}
.hist li{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:2px 10px;padding-block:9px;border-top:1px dashed var(--rule)}
.hist li:first-child{border-top:0}
.hist .s{font-size:13.5px;font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.hist .m{font-size:12px;color:var(--muted);grid-column:1}
.hist .sc{grid-row:1/3;grid-column:2;font-family:var(--f-pen);color:var(--pen);font-size:28px;line-height:1;align-self:center;font-variant-numeric:tabular-nums}
.empty{font-size:13px;color:var(--muted);margin:0}
.legend{display:flex;flex-direction:column;gap:8px;font-size:12.5px;color:var(--muted)}
.legend b{color:var(--ink);font-weight:600;margin-right:6px}

/* exam sheet */
.sheet{padding:30px 34px 36px;position:relative}
@media (max-width:560px){.sheet{padding:22px 16px 28px}}
.sheet-head{text-align:center;border-bottom:3px double var(--rule-strong);padding-bottom:14px;position:relative}
.sheet-meta{display:flex;justify-content:space-between;font-size:12.5px;color:var(--muted);letter-spacing:.04em}
.sheet-title{font-family:var(--f-paper);font-size:30px;letter-spacing:.08em;margin:6px 0 12px}
.info-scroll{overflow-x:auto}
.sheet-info{border-collapse:collapse;margin:0 auto;font-size:13px;min-width:100%}
.sheet-info th,.sheet-info td{border:1px solid var(--rule-strong);padding:5px 10px}
.sheet-info th{font-weight:600;background:var(--chip);white-space:nowrap}
.sheet-info td{text-align:left}
.score-pen{position:absolute;right:-6px;top:-18px;font-family:var(--f-pen);color:var(--pen);font-size:76px;line-height:1;transform:rotate(-9deg);pointer-events:none;font-variant-numeric:tabular-nums}
.score-pen small{font-size:38px}
@media (max-width:560px){.score-pen{font-size:56px;top:-12px;right:-4px}}
.gen{display:flex;align-items:center;gap:12px;margin-top:16px;padding:10px 14px;border:1px dashed var(--omr);border-radius:8px;font-size:13.5px;flex-wrap:wrap}
.dot{width:8px;height:8px;border-radius:50%;background:var(--omr);animation:pulse 1.2s infinite}
@keyframes pulse{50%{opacity:.25}}
@media (prefers-reduced-motion:reduce){.dot{animation:none}}
.sect{font-family:var(--f-paper);font-weight:700;font-size:15px;border-bottom:1px solid var(--rule-strong);padding:20px 0 6px;margin:0;column-span:all}
.qs{list-style:none;margin:6px 0 0;padding:0;columns:2;column-gap:44px;column-rule:1px solid var(--rule)}
.qs.one{columns:1}
@media (max-width:1000px){.qs{columns:1}}
.q{break-inside:avoid;padding-block:18px 14px;font-family:var(--f-paper);font-size:15.5px;line-height:1.75}
.q-head{display:flex;gap:8px}
.q-num{font-weight:700;position:relative;flex:none;min-width:24px}
.q-text{min-width:0;word-break:keep-all;overflow-wrap:anywhere}
.pts{font-family:var(--f-ui);font-size:12px;color:var(--muted);white-space:nowrap}
.data{margin:10px 0 4px 32px;overflow-x:auto;font-size:14px}
.data table{border-collapse:collapse;font-family:var(--f-ui);font-size:13px;font-variant-numeric:tabular-nums}
.data th,.data td{border:1px solid var(--rule-strong);padding:4px 10px;text-align:center}
.data th{background:var(--chip);font-weight:600}
.data p{margin:4px 0}
.box{margin:10px 0 6px 32px;border:1px solid var(--rule-strong);padding:16px 14px 10px;position:relative;font-size:14.5px}
.box::before{content:"<보 기>";position:absolute;top:-11px;left:50%;transform:translateX(-50%);background:var(--paper);padding:0 8px;font-size:13px}
.box div{padding-block:2px}
.opts{display:flex;flex-direction:column;gap:2px;margin:8px 0 0 26px}
.opt{display:flex;gap:6px;align-items:flex-start;border:0;background:none;text-align:left;padding:4px 6px;border-radius:6px;font-family:var(--f-paper);font-size:15px;line-height:1.6}
.opt:hover:not(:disabled){background:var(--chip)}
.opt:disabled{cursor:default}
.cn{flex:none;width:22px;height:22px;border-radius:50%;border:1.3px solid var(--ink);display:grid;place-items:center;font-family:var(--f-ui);font-size:12px;margin-top:2px}
.opt[aria-checked="true"] .cn{background:var(--ink);color:var(--paper)}
.opt.is-ans .cn{box-shadow:0 0 0 2.5px var(--pen)}
.opt.is-ans .ct{text-decoration:underline;text-decoration-color:var(--pen);text-decoration-thickness:2px;text-underline-offset:4px}
.ta{display:block;width:calc(100% - 32px);margin:10px 0 0 32px;min-height:96px;border:1px solid var(--rule-strong);border-radius:4px;background:repeating-linear-gradient(var(--paper) 0 29px,var(--rule) 29px 30px);
  padding:4px 10px;line-height:30px;font-family:var(--f-paper);font-size:15px;resize:vertical}
.ta.essay{min-height:210px}
.ta:disabled{opacity:.9}
.tcount{margin:2px 0 0 32px;font-family:var(--f-ui);font-size:11.5px;color:var(--muted)}
/* grading marks */
.q.correct .q-num::after,.q.part .q-num::after{content:"";position:absolute;left:-9px;top:-5px;width:40px;height:36px;border:2.6px solid var(--pen);border-radius:52% 46% 55% 44%;transform:rotate(-12deg)}
.q.part .q-num::after{border-style:solid;clip-path:polygon(0 0,100% 0,100% 55%,0 55%)}
.q.wrong .q-num::after{content:"";position:absolute;left:-6px;top:-8px;width:3px;height:44px;background:var(--pen);border-radius:3px;transform:rotate(38deg);transform-origin:center}
.review{margin:10px 0 0 32px;font-family:var(--f-ui);font-size:13.5px;line-height:1.6;border-left:2px solid var(--pen);padding:4px 0 4px 12px}
.review .verdict{font-weight:600;color:var(--pen)}
.review .verdict.okc{color:var(--ok)}
.review .lbl{font-weight:600;font-size:12px;color:var(--muted);letter-spacing:.04em;display:block;margin-top:6px}
.review p{margin:2px 0}
.rubric{list-style:none;padding:0;margin:4px 0 0;display:flex;flex-direction:column;gap:4px}
.rubric label{display:flex;gap:8px;align-items:flex-start;cursor:pointer}
.rubric input{accent-color:var(--pen);margin-top:4px;flex:none}
.rubric .p{margin-left:auto;font-variant-numeric:tabular-nums;color:var(--muted);white-space:nowrap}
.fb{font-family:var(--f-pen);color:var(--pen);font-size:21px;line-height:1.3;margin-top:6px}

/* OMR card */
.omr{position:sticky;top:16px;padding:0;overflow:hidden;border:1.5px solid var(--omr)}
.omr-h{background:var(--omr);color:#fff;padding:9px 14px;display:flex;justify-content:space-between;align-items:baseline;font-weight:600;font-size:14px;letter-spacing:.1em}
.omr-h span{font-size:12px;letter-spacing:0;font-weight:500;font-variant-numeric:tabular-nums}
.omr-body{padding:10px 12px 12px;max-height:min(58vh,560px);overflow:auto}
.omr-row{display:grid;grid-template-columns:28px repeat(5,1fr);align-items:center;gap:4px;padding-block:3px;border-bottom:1px solid var(--omr-soft)}
.omr-row:nth-child(5n){border-bottom:1.5px solid var(--omr)}
.omr-n{font-size:12px;color:var(--omr);font-weight:600;text-align:center;font-variant-numeric:tabular-nums}
.bub{width:18px;height:24px;border-radius:50%;border:1.3px solid var(--omr);background:none;font-size:9.5px;color:var(--omr);padding:0;justify-self:center;font-family:var(--f-ui);line-height:1}
.bub.f{background:var(--ink);border-color:var(--ink);color:transparent}
.bub.a{box-shadow:0 0 0 2px var(--pen)}
.bub:disabled{cursor:default}
.omr-w{margin-top:10px;font-size:12px;color:var(--omr);font-weight:600}
.wchips{display:flex;flex-wrap:wrap;gap:5px;margin-top:6px}
.wchip{border:1.3px solid var(--omr);background:none;border-radius:5px;font-size:12px;padding:1px 7px;color:var(--omr);font-variant-numeric:tabular-nums}
.wchip.f{background:var(--ink);border-color:var(--ink);color:var(--paper)}
.omr-foot{padding:12px;border-top:1.5px solid var(--omr);display:flex;flex-direction:column;gap:8px}
.confirm{font-size:13px;display:flex;flex-direction:column;gap:8px}
.confirm .row{display:flex;gap:8px;flex-wrap:wrap}
@media (max-width:900px){.omr{position:static}.exam-side{order:2}}

/* result card */
.res{padding:20px 18px}
.res .big{font-family:var(--f-pen);color:var(--pen);font-size:64px;line-height:.9;font-variant-numeric:tabular-nums}
.res .big small{font-size:30px}
.res .tag{display:inline-block;margin-top:6px;font-size:12.5px;font-weight:600;border:1.5px solid var(--pen);color:var(--pen);border-radius:5px;padding:1px 8px}
.kv{display:grid;grid-template-columns:auto 1fr;gap:4px 14px;font-size:13.5px;margin:14px 0 0}
.kv dt{color:var(--muted)}
.kv dd{margin:0;text-align:right;font-variant-numeric:tabular-nums}
.bars{display:flex;flex-direction:column;gap:9px;margin-top:16px;padding-top:14px;border-top:1px solid var(--rule)}
.bar-l{display:flex;justify-content:space-between;font-size:12.5px;gap:8px}
.bar-l span:first-child{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bar-t{height:7px;border-radius:4px;background:var(--chip);overflow:hidden;margin-top:3px}
.bar-t i{display:block;height:100%;background:var(--ink);border-radius:4px}
.res-actions{display:flex;flex-direction:column;gap:8px;margin-top:18px}
.grading{margin-top:12px;font-size:13px;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
@media (max-width:900px){.result-side{order:-1}}

/* OX, line matching, short answer */
.oxs{display:flex;gap:10px;margin:10px 0 0 32px}
.oxb{width:58px;height:44px;border:1.5px solid var(--ink);border-radius:8px;background:none;font-size:22px;font-weight:700;font-family:var(--f-ui);line-height:1}
.oxb:hover:not(:disabled){background:var(--chip)}
.oxb.on{background:var(--ink);color:var(--paper)}
.oxb.is-ans{box-shadow:0 0 0 3px var(--pen)}
.oxb:disabled{cursor:default}
.match{position:relative;display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);column-gap:56px;margin:12px 0 0 32px}
@media (max-width:560px){.match{margin-left:0;column-gap:34px}}
.mlines{position:absolute;left:0;top:0;width:100%;height:100%;pointer-events:none;overflow:visible}
.mcol{display:flex;flex-direction:column;gap:8px;min-width:0}
.mi{display:flex;align-items:center;gap:8px;border:1px solid var(--rule);border-radius:8px;padding:8px 10px;background:var(--paper);text-align:left;width:100%;font-family:var(--f-paper);font-size:14.5px;line-height:1.5;min-height:44px;min-width:0}
.mi:hover:not(:disabled){border-color:var(--muted)}
.mi:disabled{cursor:default}
.mi .mt{min-width:0;overflow-wrap:anywhere;flex:1}
.mi .mlab{font-family:var(--f-ui);font-weight:600;font-size:12.5px;color:var(--muted);flex:none}
.mdot{width:12px;height:12px;border-radius:50%;border:2px solid var(--ink);background:var(--paper);flex:none}
.mi.L .mdot{margin-left:auto}
.mi.on .mdot{background:var(--ink)}
.mi.sel{border-color:var(--omr);box-shadow:0 0 0 2px var(--omr-soft)}
.mi.sel .mdot{border-color:var(--omr);background:var(--omr)}

h0a:[S('빅뱅 우주론에 따라 초기 우주에서 만들어진 수소와 헬륨의 질량비(수소 : 헬륨)는 약 얼마인가?',['1 : 1','1 : 3','3 : 1','9 : 1','12 : 1'],2,'빅뱅 핵합성으로 수소와 헬륨의 질량비는 약 3 : 1이 되었다. 개수비로는 약 12 : 1이다.',2),
 S('알칼리 금속(Li, Na, K)의 공통적인 성질로 옳은 것은?',['물과 반응하여 수소 기체를 발생시킨다','실온에서 모두 기체이다','원자가 전자가 7개이다','다른 원소와 거의 반응하지 않는다','음이온이 되기 쉽다'],0,'알칼리 금속은 원자가 전자가 1개로 양이온이 되기 쉽고, 물과 격렬히 반응해 수소를 발생시킨다.',1),
 S('다음 중 공유 결합만으로 이루어진 물질은?',['H₂O','NaCl','MgO','CaCl₂','KF'],0,'물은 비금속 원소끼리 전자쌍을 공유한다. 나머지는 금속과 비금속의 이온 결합 물질이다.',2)],
h0b:[S('화산 폭발로 분출된 화산재가 대기 중으로 퍼져 햇빛을 가렸다. 이 현상에 해당하는 지구 시스템 구성 요소 간 상호 작용은?',['지권 → 기권','기권 → 수권','수권 → 생물권','생물권 → 지권','외권 → 기권'],0,'화산 활동(지권)이 대기(기권)에 영향을 준 것이다.',1),
 S('효소에 대한 설명으로 옳은 것은?',['반응의 활성화 에너지를 낮추어 반응 속도를 빠르게 한다','반응열을 크게 한다','반응 후 다른 물질로 변한다','모든 반응물과 결합할 수 있다','온도와 관계없이 활성이 같다'],0,'효소는 생체 촉매로 활성화 에너지를 낮추며 반응 후에도 변하지 않는다. 기질 특이성과 최적 온도·pH가 있다.',2),

h0c:[S('다음 반응에서 산화되는 물질은?\n2CuO + C → 2Cu + CO₂',['CuO','C','Cu','CO₂','산화되는 물질이 없다'],1,'탄소는 산소를 얻어 CO₂가 되므로 산화되고, CuO는 산소를 잃어 Cu로 환원된다.',2),

h0d:[S('엘니뇨가 발생했을 때 나타나는 현상으로 옳은 것은?',['무역풍이 약해지고 동태평양 적도 해역의 수온이 평소보다 높아진다','무역풍이 강해지고 동태평양 수온이 낮아진다','동태평양의 용승이 강해진다','페루 연안의 어획량이 크게 늘어난다','서태평양의 수온이 평소보다 높아진다'],0,'엘니뇨 때는 무역풍이 약해져 따뜻한 해수가 동쪽으로 이동하고, 동태평양 수온이 오르며 용승이 약해진다.',2),
 S('생태 피라미드에서 상위 영양 단계로 갈수록 에너지양이 줄어드는 주된 까닭은?',['각 단계에서 호흡 등으로 에너지가 열로 방출되기 때문','상위 단계 생물의 몸집이 작기 때문','상위 단계에서 에너지가 새로 만들어지기 때문','분해자가 에너지를 생산자에게 되돌려 주기 때문','빛에너지가 모든 단계에 똑같이 공급되기 때문'],0,'각 영양 단계에서 생물이 호흡 등으로 에너지를 열로 잃기 때문에 다음 단계로 전달되는 에너지가 줄어든다.',2),
 S('코일 근처에서 자석을 움직이면 코일에 전류가 흐른다. 이 현상을 이용한 장치가 아닌 것은?',['발전기','교통카드 단말기','전기 기타의 픽업','전동기','변압기'],3,'전동기는 자기장 속에서 전류가 흐르는 도선이 받는 힘을 이용한다. 나머지는 전자기 유도를 이용한다.',3)],
h1a:[S('마찰이 없는 수평면에서 질량 2 kg, 속력 3 m/s로 운동하던 물체 A가 정지해 있던 질량 1 kg인 물체 B와 충돌한 뒤 한 덩어리가 되어 운동했다. 충돌 후 속력은?',['1 m/s','1.5 m/s','2 m/s','3 m/s','6 m/s'],2,'운동량 보존: 2×3 = (2+1)v → v = 2 m/s.',3),
 S('열기관이 고열원에서 400 J의 열을 흡수하여 100 J의 일을 했다. 이 열기관의 열효율과 저열원으로 방출한 열은?',['25 %, 300 J','25 %, 100 J','75 %, 300 J','40 %, 300 J','20 %, 400 J'],0,'열효율 = W/Q₁ = 100/400 = 25 %. 방출한 열 Q₂ = 400 − 100 = 300 J.',2),
 S('특수 상대성 이론에 따른 현상으로 옳은 것은?',['관찰자에 대해 빠르게 움직이는 우주선의 시간은 느리게 간다','빛의 속력은 관찰자의 운동에 따라 달라진다','움직이는 물체의 길이는 운동 방향으로 늘어난다','동시성은 모든 관성 좌표계에서 같다','질량은 에너지로 바뀔 수 없다'],0,'시간 팽창과 운동 방향의 길이 수축이 일어나며, 광속은 모든 관찰자에게 같고 동시성은 상대적이다.',2)],
h1b:[S('보어의 수소 원자 모형에서 전자가 전이할 때 방출되는 빛에 대한 설명으로 옳은 것은?',['두 에너지 준위의 차이가 클수록 방출되는 빛의 진동수가 크다','전자가 낮은 준위에서 높은 준위로 전이할 때 빛을 방출한다','방출되는 빛의 스펙트럼은 연속 스펙트럼이다','n=2 → n=1 전이에서 가시광선이 방출된다','에너지 준위는 연속적인 값을 가진다'],0,'E = hf이므로 에너지 차가 클수록 진동수가 크다. 높은 준위→낮은 준위에서 방출하며 선 스펙트럼이 나타난다. n=2→1은 자외선(라이먼 계열)이다.',2),
 S('순수한 규소(Si)에 붕소(B)를 소량 첨가해 만든 반도체에 대한 설명으로 옳은 것은?',['p형 반도체이며 주로 양공이 전류를 운반한다','n형 반도체이며 주로 전자가 전류를 운반한다','p형 반도체이며 주로 전자가 전류를 운반한다','도체가 되어 띠틈이 사라진다','절연체가 된다'],0,'원자가 전자가 3개인 붕소를 첨가하면 양공이 생기는 p형 반도체가 된다.',2),
 S('나란한 두 직선 도선에 같은 방향으로 전류가 흐를 때 두 도선 사이에 작용하는 힘은?',['서로 당기는 힘','서로 미는 힘','힘이 작용하지 않는다','전류가 클수록 미는 힘이 커진다','도선 길이와 관계없이 0이다'],0,'같은 방향의 전류는 서로 당기고, 반대 방향의 전류는 서로 민다.',3)],
h1c:[S('빛이 공기에서 물로 비스듬히 진행할 때 변하지 않는 것은?',['진동수','속력','파장','진행 방향','파장과 속력 모두'],0,'굴절할 때 진동수는 변하지 않고, 속력과 파장이 줄어들며 진행 방향이 꺾인다.',2),
 S('전반사가 일어나기 위한 조건으로 옳은 것은?',['굴절률이 큰 매질에서 작은 매질로 진행하고, 입사각이 임계각보다 클 때','굴절률이 작은 매질에서 큰 매질로 진행하고, 입사각이 임계각보다 클 때','굴절률이 큰 매질에서 작은 매질로 진행하고, 입사각이 임계각보다 작을 때','두 매질의 굴절률이 같을 때','입사각이 0°일 때'],0,'전반사는 빛이 굴절률이 큰 매질에서 작은 매질로 진행하며 입사각이 임계각보다 클 때 일어난다.',2),

h2c:[S('다음 분자 중 결합각이 가장 작은 것은?',['H₂O','NH₃','CH₄','BF₃','CO₂'],0,'H₂O(약 104.5°) < NH₃(약 107°) < CH₄(109.5°) < BF₃(120°) < CO₂(180°). 비공유 전자쌍이 많을수록 결합각이 작아진다.',3),

 S('NaCl과 같은 이온 결합 물질의 성질로 옳은 것은?',['고체에서는 전기가 통하지 않지만 액체나 수용액에서는 통한다','고체 상태에서 전기가 잘 통한다','외부에서 힘을 가하면 잘 펴진다','녹는점이 매우 낮다','분자 단위로 존재한다'],0,'고체에서는 이온이 고정되어 전기가 통하지 않지만 녹거나 물에 녹으면 이온이 움직여 전기가 통한다. 힘을 가하면 쉽게 부서진다.',1)],

h3a:[S('에이크만은 백미를 먹인 닭은 각기병 증상을 보이고 현미를 먹인 닭은 회복된다는 실험으로 결론을 얻었다. 이처럼 가설을 세우고 실험으로 검증하는 탐구 방법은?',['연역적 탐구','귀납적 탐구','관찰 탐구','문헌 조사','모형 탐구'],0,'가설을 설정하고 대조 실험으로 검증하는 방법은 연역적 탐구이다.',2),

h3b:[S('세포 호흡에 대한 설명으로 옳은 것은?',['주로 미토콘드리아에서 일어나며 포도당의 에너지 일부가 ATP에 저장된다','빛에너지를 화학 에너지로 전환한다','엽록체에서만 일어난다','에너지를 흡수하는 동화 작용이다','산소를 생성한다'],0,'세포 호흡은 이화 작용으로, 주로 미토콘드리아에서 산소를 이용해 포도당을 분해하고 에너지 일부를 ATP에 저장한다.',1),

 S('골격근이 수축할 때 근육 원섬유 마디의 변화로 옳은 것은?',['H대와 I대는 짧아지고 A대의 길이는 변하지 않는다','A대가 짧아지고 I대는 변하지 않는다','액틴 필라멘트의 길이가 짧아진다','마이오신 필라멘트의 길이가 짧아진다','H대가 길어진다'],0,'액틴이 마이오신 사이로 미끄러져 들어가며 수축하므로 필라멘트 길이는 그대로이다. A대는 일정하고 H대와 I대가 짧아진다.',3)],

h3e:[S('다음 중 한 개체군 안에서 나타나는 상호 작용은?',['텃세','경쟁 배타','상리 공생','기생','포식과 피식'],0,'텃세, 순위제, 리더제, 사회생활, 가족생활은 개체군 내 상호 작용이고, 나머지는 서로 다른 개체군 사이의 상호 작용이다.',2),

h4a:[S('해령을 중심으로 해양 지각의 고지자기 줄무늬가 대칭적으로 나타나는 것이 지지하는 이론은?',['해양저 확장설','지구 수축설','지향사설','정적 지구설','육교설'],0,'해령에서 생성된 해양 지각이 양쪽으로 멀어지며 당시 지구 자기장의 방향을 기록해 대칭 줄무늬가 생긴다.',2),

 S('라니냐 시기에 대한 설명으로 옳은 것은?',['무역풍이 강해져 동태평양 적도 해역의 용승이 강해진다','동태평양 표층 수온이 평소보다 높다','서태평양의 강수량이 평소보다 줄어든다','무역풍이 약해진다','워커 순환이 약해진다'],0,'라니냐 때는 무역풍이 강해져 동태평양 용승이 강해지고 수온이 낮아지며, 서태평양은 강수가 늘어난다.',3)],

m1a:[W('short','화강암과 현무암의 결정 크기가 다른 까닭을 마그마가 식는 장소와 속도를 들어 서술하시오.','화강암은 마그마가 지하 깊은 곳에서 천천히 식어 결정이 크고, 현무암은 지표 근처에서 빠르게 식어 결정이 작다.',[['화강암: 깊은 곳에서 천천히 식어 결정이 큼',2],['현무암: 지표 근처에서 빨리 식어 결정이 작음',2],['냉각 속도가 느릴수록 결정이 크다는 관계를 밝힘',1]],2),
 W('essay','우리나라가 일본보다 지진과 화산 활동이 적은 까닭을 판의 경계와 관련지어 논술하시오.','지진과 화산은 판과 판이 만나는 경계에 집중된다. 일본은 태평양판·필리핀판이 유라시아판 아래로 섭입하는 수렴형 경계 부근에 있어 판의 충돌로 응력이 쌓이고 마그마가 생성되어 지진·화산이 잦다. 반면 우리나라는 유라시아판 내부에 있어 판 경계에서 멀기 때문에 상대적으로 활동이 적다. 다만 판 내부에서도 응력이 전달되어 지진이 일어날 수 있다.',[['일본은 수렴형 경계(섭입대) 부근에 위치함',3],['우리나라는 판 경계에서 떨어진 판 내부에 위치함',3],['판 경계에서 지진·화산이 집중되는 원리(응력, 마그마 생성)를 설명',2],['논리적 구성과 정확한 과학 용어',2]],3)],
m1b:[W('short','물속에 완전히 잠긴 물체를 더 깊이 넣어도 부력의 크기가 변하지 않는 까닭을 서술하시오.','부력은 물체가 밀어낸 물의 무게, 즉 물에 잠긴 부피에 따라 결정되는데, 완전히 잠긴 뒤에는 잠긴 부피가 변하지 않기 때문이다.',[['부력은 잠긴 부피(밀어낸 물의 양)에 따라 결정됨',3],['완전히 잠긴 뒤에는 잠긴 부피가 일정함',2]],2)],

m3d:[W('short','뜨거운 물체에 손이 닿았을 때 뜨겁다고 느끼기 전에 손을 먼저 떼는 까닭을 서술하시오.','이 반응은 척수가 중추인 무조건 반사로, 자극이 대뇌를 거치지 않고 척수에서 바로 운동 신경으로 전달되므로 대뇌가 뜨거움을 느끼기 전에 빠르게 반응한다.',[['척수가 중추인 무조건 반사',3],['대뇌를 거치지 않아 반응이 빠름',2]],2)],
m3e:[W('short','생식세포의 염색체 수가 체세포의 절반이어야 하는 까닭을 서술하시오.','수정할 때 난자와 정자가 합쳐지므로, 생식세포의 염색체 수가 절반이어야 수정란의 염색체 수가 부모의 체세포와 같아져 대를 거듭해도 염색체 수가 일정하게 유지된다.',[['수정으로 두 생식세포가 합쳐짐',2],['자손의 염색체 수가 대대로 일정하게 유지됨',3]],2),
 W('essay','멘델이 완두를 실험 재료로 쓴 것이 유리했던 까닭을 세 가지 들고, 우열의 원리와 분리의 법칙을 논술하시오.','완두는 대립 형질이 뚜렷하고, 자가 수분과 타가 수분이 쉬워 교배를 조절하기 쉬우며, 한 세대가 짧고 자손 수가 많아 통계 처리에 유리하다. 순종 둥근 완두와 순종 주름진 완두를 교배하면 잡종 1대는 모두 둥근 완두만 나타나는데, 이는 대립 형질 중 우성만 표현되는 우열의 원리이다. 잡종 1대를 자가 수분하면 쌍을 이룬 유전자가 생식세포로 나뉘어 들어가는 분리의 법칙에 따라 잡종 2대에서 둥근 : 주름진 = 3 : 1이 나타난다.',[['완두가 유리한 까닭 세 가지(대립 형질 뚜렷, 교배 조절 쉬움, 세대 짧고 자손 많음)',3],['우열의 원리와 잡종 1대 결과',2],['분리의 법칙과 잡종 2대 3:1',3],['논리적 구성과 정확한 과학 용어',2]],3)],
m3f:[W('short','실제 진자 운동에서 진자가 점점 낮게 올라가는 까닭을 에너지 보존과 함께 서술하시오.','공기 저항과 마찰 때문에 역학적 에너지의 일부가 열에너지나 소리 에너지로 전환되어 역학적 에너지가 줄어든다. 그러나 전환된 에너지까지 합한 전체 에너지의 양은 보존된다.',[['마찰·공기 저항으로 일부가 열·소리 에너지로 전환',3],['전체 에너지의 총량은 보존됨',2]],2)],
m3g:[W('short','별 A는 별 B보다 겉보기 등급은 작지만 절대 등급은 크다. 지구에서 더 가까운 별을 쓰고, 그 까닭을 서술하시오.','A이다. 겉보기 등급이 작은 A가 지구에서 더 밝게 보이지만, 절대 등급이 크므로 실제 밝기는 B보다 어둡다. 실제로 어두운데 더 밝게 보이므로 A가 더 가까이 있다.',[['답: A',2],['겉보기 등급이 작으면 밝게 보이고 절대 등급이 크면 실제로 어두움',2],['실제로 어두운데 밝게 보이므로 가까움',1]],3)],
m3h:[W('short','과학기술의 발달로 생긴 문제점 한 가지와 그 해결 방안을 서술하시오.','예를 들어 플라스틱 사용이 늘면서 미세 플라스틱 오염이 생겼다. 생분해성 플라스틱을 개발하고 재활용 체계를 강화하며 일회용품 사용을 줄일 수 있다.',[['과학기술로 생긴 구체적 문제점',2],['문제점에 맞는 구체적 해결 방안',3]],1)],
h0a:[W('short','빅뱅 직후에는 만들어지지 않은 탄소, 산소, 철 같은 무거운 원소가 어떻게 생성되었는지 서술하시오.','별의 중심부에서 핵융합으로 헬륨보다 무거운 탄소, 산소 등이 생성되고, 질량이 큰 별의 중심부에서는 철까지 생성된다. 철보다 무거운 원소는 초신성 폭발 과정에서 만들어진다.',[['별 내부 핵융합으로 탄소·산소 등 생성',2],['질량이 큰 별 중심부에서 철까지 생성',1],['철보다 무거운 원소는 초신성 폭발로 생성',2]],2)],
h0b:[W('short','자동차의 에어백이 탑승자의 부상을 줄이는 원리를 충격량과 힘의 관계로 서술하시오.','탑승자가 정지할 때 운동량 변화량, 즉 충격량은 같지만 에어백이 충돌 시간을 늘려 주므로 충격량 = 힘 × 시간에서 탑승자가 받는 평균 힘이 작아진다.',[['충격량(운동량 변화량)은 같음',2],['충돌 시간을 늘림',2],['따라서 받는 평균 힘이 작아짐',1]],2)],
h0c:[W('short','산성화된 호수에 석회 가루(염기성 물질)를 뿌리는 까닭을 서술하시오.','석회의 염기 성분이 호수 속 산의 H⁺과 중화 반응을 하여 H⁺ 농도를 줄이므로 pH가 높아져 산성이 약해진다.',[['중화 반응',3],['H⁺이 줄어 pH가 높아짐(산성 약화)',2]],2)],
h0d:[W('short','화석 연료 사용이 지구 온난화를 일으키는 과정을 서술하시오.','화석 연료를 태우면 이산화 탄소가 배출된다. 이산화 탄소 같은 온실 기체는 지표가 방출하는 적외선 복사 에너지를 흡수했다가 다시 지표로 방출하므로 온실 효과가 강해져 지구의 평균 기온이 올라간다.',[['화석 연료 연소로 이산화 탄소 배출',2],['온실 기체가 지표 복사 에너지를 흡수·재방출',2],['지구 평균 기온 상승',1]],2),
 W('essay','신재생 에너지의 장점과 한계를 화석 연료와 비교하여 논술하시오. (두 가지 이상의 에너지원을 예로 들 것)','태양광과 풍력은 발전 과정에서 이산화 탄소를 거의 배출하지 않고 자원이 고갈되지 않는다는 점에서 화석 연료보다 유리하다. 그러나 날씨와 시간에 따라 발전량이 달라 공급이 불안정하고, 넓은 부지와 높은 초기 설치 비용이 필요하다. 화석 연료는 에너지 밀도가 높고 원하는 때에 발전할 수 있지만 온실 기체와 대기 오염 물질을 배출하고 매장량이 한정되어 있다. 따라서 에너지 저장 장치(ESS) 개발, 전력망 개선과 함께 신재생 에너지 비중을 늘려 나가야 한다.',[['두 가지 이상의 신재생 에너지원 제시',2],['장점(온실 기체 감소, 고갈 없음) 설명',2],['한계(간헐성, 부지·비용 등) 설명',3],['화석 연료와의 비교와 해결 방향 제시',3]],3)],
h1a:[W('short','열기관의 열효율이 100 %가 될 수 없는 까닭을 열역학 제2법칙과 관련지어 서술하시오.','열역학 제2법칙에 따라 열은 스스로 모두 일로 바뀔 수 없으므로, 열기관은 흡수한 열의 일부를 반드시 저열원으로 방출해야 한다. 따라서 열효율은 100 %가 될 수 없다.',[['흡수한 열의 일부는 반드시 저열원으로 방출',3],['열을 모두 일로 바꿀 수 없다는 제2법칙',2]],3),
 W('essay','자동차 안전 장치(안전띠, 에어백, 범퍼의 찌그러지는 구조)가 탑승자를 보호하는 원리를 관성, 운동량, 충격량 개념으로 논술하시오.','자동차가 갑자기 멈추면 탑승자는 관성에 의해 계속 앞으로 움직이려 한다. 안전띠는 탑승자를 차와 함께 멈추게 해 앞으로 튕겨 나가는 것을 막는다. 탑승자가 정지할 때까지의 운동량 변화량, 즉 충격량은 정해져 있으므로, 에어백과 찌그러지는 범퍼는 충돌 시간을 늘려 같은 충격량에서 받는 평균 힘을 줄인다. 범퍼는 찌그러지며 충돌 에너지를 흡수해 탑승 공간으로 전달되는 충격을 줄인다.',[['관성과 안전띠의 역할',2],['충격량 = 운동량 변화량 = 힘×시간 관계 제시',3],['에어백·범퍼가 충돌 시간을 늘려 평균 힘을 줄임',3],['논리적 구성과 정확한 과학 용어',2]],3)],
h1b:[W('short','발광 다이오드(LED)가 빛을 내는 원리를 에너지띠를 들어 서술하시오.','순방향 전압을 걸면 n형의 전자와 p형의 양공이 접합면으로 이동해 결합한다. 이때 전도띠의 전자가 원자가 띠로 떨어지며 띠틈에 해당하는 에너지를 빛으로 방출한다.',[['순방향 전압에서 전자와 양공이 접합면에서 결합',2],['전도띠의 전자가 원자가 띠로 전이',2],['띠틈에 해당하는 에너지가 빛으로 방출',1]],3)],
h1c:[W('short','광섬유에서 빛이 밖으로 새어 나가지 않고 진행하는 원리를 서술하시오.','광섬유의 중심부(코어)는 바깥(클래딩)보다 굴절률이 크고, 빛이 경계면에 임계각보다 큰 입사각으로 들어가므로 전반사를 반복하며 진행한다.',[['코어의 굴절률이 클래딩보다 큼',2],['입사각이 임계각보다 커서 전반사',3]],2)],
h2a:[W('short','화학 반응식의 계수비가 의미하는 바를 몰과 관련지어 서술하시오.','계수비는 반응하거나 생성되는 물질의 몰수비(입자 수의 비)와 같다. 기체의 경우 같은 온도와 압력에서는 부피비와도 같다.',[['계수비 = 몰수비(입자 수의 비)',3],['기체는 같은 조건에서 부피비와 같음',2]],2)],
h2b:[W('short','Na⁺의 반지름이 Na 원자보다 작은 까닭을 서술하시오.','Na이 전자 1개를 잃어 Na⁺이 되면 가장 바깥 전자 껍질이 없어져 전자 껍질 수가 줄어들고, 전자 수가 줄어 유효 핵전하가 커지므로 반지름이 작아진다.',[['전자를 잃어 전자 껍질 수가 줄어듦',3],['유효 핵전하가 커져 전자를 강하게 당김',2]],2)],
h2c:[W('short','CO₂는 C=O 결합이 극성 공유 결합인데도 무극성 분자인 까닭을 서술하시오.','CO₂는 결합각이 180°인 직선형 구조이므로 두 C=O 결합의 쌍극자 모멘트가 크기는 같고 방향이 반대여서 서로 상쇄된다.',[['직선형 구조(180°)',2],['두 결합의 쌍극자 모멘트가 상쇄됨',3]],2),
 W('essay','물의 끓는점이 분자량이 비슷한 다른 분자보다 높고, 얼음이 물에 뜨는 까닭을 물 분자의 구조와 분자 사이의 힘으로 논술하시오.','물 분자는 산소의 전기 음성도가 커서 O−H 결합이 극성을 띠고, 굽은형 구조라 극성 분자이다. 한 물 분자의 H와 이웃 분자의 O 사이에 강한 수소 결합이 생기므로 분자 사이 인력이 커서 끓는점이 높다. 얼음이 될 때는 수소 결합이 일정한 방향으로 형성되어 빈 공간이 많은 육각형 구조를 이루므로 부피가 커지고 밀도가 물보다 작아져 물에 뜬다.',[['물 분자의 극성(전기 음성도 차, 굽은형 구조)',2],['수소 결합으로 분자 사이 인력이 커 끓는점이 높음',3],['얼음의 육각형 구조로 부피 증가·밀도 감소',3],['논리적 구성과 정확한 과학 용어',2]],4)],
h2d:[W('short','철이 녹스는 반응 4Fe + 3O₂ → 2Fe₂O₃에서 산화되는 물질과 환원되는 물질을 산화수 변화로 서술하시오.','Fe의 산화수가 0에서 +3으로 증가하므로 Fe는 산화되고, O의 산화수가 0에서 −2로 감소하므로 O₂는 환원된다.',[['Fe: 0 → +3, 산화됨',3],['O: 0 → −2, 환원됨',2]],2)],
h3a:[W('short','바이러스를 생물과 무생물의 중간 단계로 보는 까닭을 서술하시오.','바이러스는 숙주 세포 밖에서는 스스로 물질대사를 하지 못하고 단백질 결정처럼 존재해 무생물의 특성을 보인다. 그러나 숙주 세포 안에서는 유전 물질을 이용해 증식하고 돌연변이로 진화하는 생물의 특성을 보인다.',[['숙주 밖에서는 물질대사를 못 함(무생물적 특성)',2],['숙주 안에서 유전 물질로 증식·진화(생물적 특성)',3]],2)],
h3b:[W('short','운동할 때 호흡과 심장 박동이 빨라지는 까닭을 세포 호흡과 관련지어 서술하시오.','운동하면 근육 세포에서 세포 호흡이 활발해져 ATP가 많이 필요하다. 이를 위해 더 많은 산소와 포도당을 공급하고 생성된 이산화 탄소를 빨리 내보내야 하므로 호흡과 심장 박동이 빨라진다.',[['근육 세포의 세포 호흡 증가(ATP 필요량 증가)',2],['더 많은 산소와 영양소 공급',2],['이산화 탄소를 빨리 배출',1]],2)],
h3c:[W('short','혈당량이 낮을 때 이자에서 분비되는 호르몬과 그 작용을 서술하시오.','이자의 α세포에서 글루카곤이 분비되어 간에 저장된 글리코젠을 포도당으로 분해하게 하므로 혈당량이 높아진다.',[['글루카곤(이자 α세포)',2],['간에서 글리코젠을 포도당으로 분해',2],['혈당량 증가',1]],2),

async function gradeWritten(){
  const ex=state.exam;const items=ex.questions.map((q,i)=>({q,i})).filter(({q,i})=>WR(q.type)&&String(ex.answers[i]||'').trim());
  ex.questions.forEach((q,i)=>{if(WR(q.type)&&!String(ex.answers[i]||'').trim()){ex.met[i]=[];ex.fb[i]='답안을 쓰지 않았어요.'}});
  if(!items.length){ex.grading='done';return}
  if(!sample||aiState==='none'){ex.grading='self';return}
  ex.grading='busy';
  const prompt=`너는 대한민국 ${LVN[U[ex.units[0]].lv]} 과학 교사다. 학생의 서술형·논술형 답안을 채점 기준표에 따라 채점하라.
원칙: 표현이 달라도 과학적으로 같은 뜻이면 인정한다. 틀린 개념이 섞이면 그 요소는 인정하지 않는다. 기준에 없는 내용으로 점수를 주지 않는다. 근거 없이 결론만 쓴 요소는 인정하지 않는다.

${items.map(({q,i})=>`### 문항 ${i+1} (${TYPES[q.type].name}, ${q.pts}점)
발문: ${q.q}
모범 답안: ${q.model}
채점 기준: ${q.rubric.map((r,k)=>`[${k}] ${r.c} (${r.p}점)`).join(' / ')}
학생 답안: """${String(ex.answers[i]).slice(0,3000)}"""`).join('\n\n')}

JSON 배열 하나로만 답하라: [{"n":문항 번호,"met":[충족한 기준 번호들],"feedback":"학생에게 주는 1~2문장 피드백(부족한 점 위주, '~해요'체)"}]`;
  const ctl=new AbortController();gradeCtl=ctl;
  try{const res=await sample.json(prompt,{signal:ctl.signal,cache:false,modelTier:ex.diff>=4?'complex':'default'});
    if(ex!==state.exam)return;
    if(Array.isArray(res))for(const r of res){const i=Number(r.n)-1;const q=ex.questions[i];if(!q||!WR(q.type))continue;
      ex.met[i]=(Array.isArray(r.met)?r.met:[]).map(Number).filter(k=>k>=0&&k<q.rubric.length);ex.fb[i]=String(r.feedback||'');ex.aiGraded[i]=true}
    ex.grading='done';
  }catch(e){if(ex!==state.exam)return;ex.grading='self';if(e&&e.code!=='cancelled')ex.gradeErr=errCopy(e&&e.code)+' 기준표를 보고 직접 채점할 수 있어요.';
    if(['not_granted','sampling_disabled'].includes(e&&e.code))aiState='none'}
  gradeCtl=null;
}
function scoreOf(ex){
  let got=0,tot=0;const by={},bt={};
  ex.questions.forEach((q,i)=>{const g=gradeQ(q,i,ex);got+=g;tot+=q.pts;
    const u=q.unit||'기타';by[u]=by[u]||{g:0,t:0};by[u].g+=g;by[u].t+=q.pts;
    bt[q.type]=bt[q.type]||{g:0,t:0,n:0,r:0};bt[q.type].g+=g;bt[q.type].t+=q.pts;bt[q.type].n++;if(g>=q.pts-1e-9)bt[q.type].r++});
  return{got,tot,pct:tot?Math.round(got/tot*100):0,by,bt};
}

function listHTML(ex){
  const sec={};ex.questions.forEach((q,i)=>{(sec[q.type]=sec[q.type]||[]).push(qHTML(q,i,ex))});
  const used=ORDER.filter(t=>sec[t]);const multi=used.length>1;
  return used.map((t,n)=>`${multi?`<h3 class="sect">${ROMAN[n]}. ${SECT[t]}</h3>`:''}<ol class="qs${['mc','ox','fill'].includes(t)?'':' one'}" id="qs-${t}">${sec[t].join('')}</ol>`).join('');
}
function drawLines(){
  const ex=state.exam;if(!ex)return;
  document.querySelectorAll('.match').forEach(box=>{
    const i=+box.dataset.q,q=ex.questions[i],a=ex.answers[i]||{},svg=box.querySelector('.mlines');if(!q||!svg)return;
    const R=box.getBoundingClientRect();let s='';
    for(const l of Object.keys(a)){const d=a[l];const p1=box.querySelector(`[data-dot="L${l}"]`),p2=box.querySelector(`[data-dot="R${d}"]`);if(!p1||!p2)continue;
      const r1=p1.getBoundingClientRect(),r2=p2.getBoundingClientRect();
      const x1=r1.left+r1.width/2-R.left,y1=r1.top+r1.height/2-R.top,x2=r2.left+r2.width/2-R.left,y2=r2.top+r2.height/2-R.top;
      const ok=q.rOrder[d]===+l;
      const st=ex.submitted?(ok?'stroke:var(--ink);stroke-width:2.4':'stroke:var(--pen);stroke-width:2.4;stroke-dasharray:6 5'):'stroke:var(--ink);stroke-width:2.2';
      s+=`<line x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}" style="${st};stroke-linecap:round"/>`}
    svg.innerHTML=s;
  });
}
window.addEventListener('resize',()=>drawLines());
try{document.fonts&&document.fonts.ready.then(()=>drawLines())}catch(e){}
function renderExam(){
  const ex=state.exam;if(!ex){state.view='setup';return renderSetup()}
  const lv=U[ex.units[0]].lv,sc=ex.submitted?scoreOf(ex):null;
  const now=new Date();
  document.getElementById('app').innerHTML=`
  <header class="top"><div class="brand"><span class="seal">과</span><div><h1>과학 단원평가실</h1><p>${esc(scopeLabel(ex.units))}</p></div></div>
    <div>${ex.submitted?`<button class="ghost" data-act="home">설정으로</button>`:state.quitAsk?`<span class="note">시험을 그만둘까요? 답은 저장되지 않아요. </span><button class="ghost" data-act="quit-yes">그만두기</button> <button class="ghost" data-act="quit-no">계속</button>`:`<button class="ghost" data-act="quit">그만두기</button>`}</div></header>
  <div class="grid">
   <article class="paper sheet">
    <div class="sheet-head">
      <div class="sheet-meta"><span>${now.getFullYear()}학년도</span><span>${LVN[lv]} 과학</span></div>
      <h2 class="sheet-title">과학 단원평가</h2>
      <div class="info-scroll"><table class="sheet-info"><tr><th>범위</th><td>${esc(ex.units.map(unitLabel).join(', '))}</td></tr>
       <tr><th>난이도</th><td>${esc(DIFF[ex.diff-1].name)} · ${ex.mode==='ai'?'AI 출제':ex.mode==='retry'?'틀린 문제 다시 풀기':'기본 문제은행'} · ${ex.questions.length||ex.count}문항 · 경과 <span id="clock">${mmss((ex.end||Date.now())-(ex.start||Date.now()))}</span></td></tr></table></div>
      ${sc&&ex.grading!=='busy'?`<div class="score-pen">${sc.pct}<small>점</small></div>`:''}
    </div>
    ${genHTML(ex)}
    <div id="qlist">${listHTML(ex)}</div>
   </article>
   <aside class="side ${ex.submitted?'result-side':'exam-side'}">
    ${ex.submitted?resultHTML(ex,sc):`<section class="paper omr" id="omr">${omrHTML(ex)}</section>`}
   </aside>
  </div>
  ${ex.submitted?'':`<div class="mbar" id="mbar">${mbarHTML(ex)}</div>`}`;
  drawLines();
  if(!ex.submitted){timer=setInterval(()=>{const c=document.getElementById('clock');if(c&&state.exam&&!state.exam.submitted)c.textContent=mmss(Date.now()-(state.exam.start||Date.now()))},1000)}
}
function mbarHTML(ex){return`<span>${answeredCount(ex)}/${ex.questions.length}문항 답함</span><button class="btn red sm" data-act="submit" ${!ex.questions.length||ex.generating?'disabled':''}>답안 제출</button>`}
function resultHTML(ex,sc){
  const tag=sc.pct===100?'만점':sc.pct>=90?'최우수':sc.pct>=75?'우수':sc.pct>=55?'보통':'다시 도전';
  const wrong=ex.questions.some((q,i)=>AUTO(q.type)&&gradeQ(q,i,ex)<q.pts-1e-9);
  return`<section class="paper res"><h3 style="font-size:14px;margin-bottom:8px">채점 결과</h3>
   ${ex.grading==='busy'?`<div class="grading"><span class="dot"></span>서술형·논술형을 채점하고 있어요<button class="ghost" data-act="stopgrade">AI 채점 멈추기</button></div>`:`<div class="big">${sc.pct}<small>점</small></div><span class="tag">${tag}</span>`}
   <dl class="kv">
    ${ORDER.filter(t=>sc.bt[t]).map(t=>{const b=sc.bt[t];return AUTO(t)&&t!=='match'?`<dt>${TYPES[t].name}</dt><dd>${b.r} / ${b.n}문항</dd>`:`<dt>${TYPES[t].name}</dt><dd>${fmt(b.g)} / ${fmt(b.t)}점</dd>`}).join('')}
    <dt>원점수</dt><dd>${fmt(sc.got)} / ${fmt(sc.tot)}점</dd>
    <dt>난이도</dt><dd>${esc(DIFF[ex.diff-1].name)}</dd>
    <dt>걸린 시간</dt><dd>${mmss(ex.end-ex.start)}</dd>
   </dl>
   ${ex.gradeErr?`<p class="err" style="margin:10px 0 0">${esc(ex.gradeErr)}</p>`:''}
   ${ex.grading==='self'&&!ex.gradeErr?`<p class="note" style="margin:10px 0 0">서술형은 기준표의 항목을 체크하면 점수가 바로 반영돼요.</p>`:''}
   <div class="bars">${Object.entries(sc.by).map(([u,v])=>{const p=v.t?Math.round(v.g/v.t*100):0;return`<div><div class="bar-l"><span>${esc(u)}</span><span>${p}%</span></div><div class="bar-t"><i style="width:${p}%"></i></div></div>`}).join('')}</div>
   <div class="res-actions">
    <button class="btn sm" data-act="again">같은 설정으로 새 시험</button>
    ${wrong?`<button class="ghost" data-act="retrywrong">틀린 문제 다시 풀기</button>`:''}
    <button class="ghost" data-act="home">설정 바꾸기</button>
   </div></section>`;
}
function rerenderList(){
  const ex=state.exam;const list=document.getElementById('qlist');if(!list)return;
  const ae=document.activeElement,id=ae&&ae.id,s=ae&&'selectionStart' in ae?[ae.selectionStart,ae.selectionEnd]:null;
  const y=window.scrollY;list.innerHTML=listHTML(ex);window.scrollTo(0,y);
  if(id){const el=document.getElementById(id);if(el){el.focus({preventScroll:true});if(s)try{el.setSelectionRange(s[0],s[1])}catch(e){}}}
  drawLines();
}
function addQuestion(){const ex=state.exam;rerenderList();refreshOMR();if(!ex.start)ex.start=Date.now()}
function refreshOMR(){const ex=state.exam;const o=document.getElementById('omr');if(o)o.innerHTML=omrHTML(ex);const m=document.getElementById('mbar');if(m)m.innerHTML=mbarHTML(ex)}
function refreshQ(i){const ex=state.exam;const li=document.getElementById('q-'+i);if(li){li.outerHTML=qHTML(ex.questions[i],i,ex)}drawLines()}
function updateGen(){const g=document.getElementById('gen');if(g)g.outerHTML=genHTML(state.exam);const f=document.getElementById('omr-foot');if(f)f.innerHTML=footHTML(state.exam);const m=document.getElementById('mbar');if(m)m.innerHTML=mbarHTML(state.exam)}
function updateCounts(){const ex=state.exam;const o=document.querySelector('.omr-h span');if(o)o.textContent=answeredCount(ex)+'/'+ex.questions.length;
  const m=document.querySelector('#mbar span');if(m)m.textContent=answeredCount(ex)+'/'+ex.questions.length+'문항 답함';
  const f=document.getElementById('omr-foot');if(f&&f.querySelector('.confirm'))f.innerHTML=footHTML(ex)}

/* ===================== 동작 ===================== */
function newExam(o){return Object.assign({units:[],diff:2,count:10,types:[],mode:'bank',questions:[],answers:{},met:{},fb:{},aiGraded:{},ovr:{},start:0,end:0,submitted:false,grading:'',generating:false,notes:[]},o)}
function startExam(mode){
  const ids=state.sel.slice();state.err='';state.quitAsk=false;state.submitAsk=false;mSel=null;
  const lvs=new Set(ids.map(id=>U[id].lv));if(lvs.size>1){state.err='중학교와 고등학교 단원을 함께 고를 수 없어요. 한 학교급만 남겨 주세요.';return render()}
  const ex=newExam({units:ids,diff:state.diff,count:state.count,types:state.types.slice(),mode});
  state.exam=ex;state.view='exam';
  if(mode==='ai'&&sample&&aiState!=='none'){render();window.scrollTo(0,0);genAI()}
  else{const r=buildBank(ids,state.diff,state.count,state.types);ex.questions=r.qs;ex.notes=r.notes;ex.count=r.qs.length||state.count;ex.mode='bank';ex.start=Date.now();
    if(!r.qs.length)ex.genErr='선택한 단원과 유형으로 낼 수 있는 문제은행 문항이 없어요. 유형을 바꾸거나 AI 출제를 쓰세요.';
    render();window.scrollTo(0,0)}
}
async function submitExam(){
  const ex=state.exam;ex.submitted=true;ex.end=Date.now();state.submitAsk=false;mSel=null;
  const p=gradeWritten();render();window.scrollTo(0,0);await p;
  if(ex!==state.exam)return;render();recordHistory(ex);
}
function recordHistory(ex){
  const sc=scoreOf(ex);const d=new Date();
  const entry={id:ex.id||(ex.id=Math.random().toString(36).slice(2)),scope:scopeLabel(ex.units),diff:DIFF[ex.diff-1].name,mode:ex.mode==='ai'?'AI':ex.mode==='retry'?'오답':'문제은행',pct:sc.pct,date:`${d.getMonth()+1}/${d.getDate()} ${String(d.getHours()).padStart(2,'0')}:${String(d.getMinutes()).padStart(2,'0')}`};
  const k=history.findIndex(h=>h.id===entry.id);if(k>=0)history[k]=entry;else history.unshift(entry);saveHist();
}
function connect(i,l,d){
  const ex=state.exam;const a=Object.assign({},ex.answers[i]||{});
  if(a[l]===d)delete a[l];else{for(const k of Object.keys(a))if(a[k]===d)delete a[k];a[l]=d}
  ex.answers[i]=a;
}
document.addEventListener('click',e=>{
  const t=e.target.closest('[data-act]');if(!t)return;const a=t.dataset.act,v=t.dataset.v;
  if(t.tagName==='INPUT'||t.tagName==='TEXTAREA')return;
  const ex=state.exam;
  switch(a){
   case'lv':state.lv=v;state.grp=GROUPS[v][0];state.sel=state.sel.filter(id=>U[id].lv===v);savePrefs();render();break;
   case'grp':state.grp=v;savePrefs();render();break;
   case'all':UNITS.filter(u=>u.lv===state.lv&&u.grp===state.grp).forEach(u=>{if(!state.sel.includes(u.id))state.sel.push(u.id)});savePrefs();render();break;
   case'none':state.sel=[];savePrefs();render();break;
   case'unpick':state.sel=state.sel.filter(x=>x!==v);savePrefs();render();break;
   case'diff':state.diff=+v;savePrefs();render();break;
   case'count':state.count=+v;savePrefs();render();break;
   case'mode':state.mode=v;render();break;
   case'start':startExam(state.mode);break;
   case'pick':{if(!ex||ex.submitted)return;const i=+t.dataset.q,o=+t.dataset.o;ex.answers[i]=ex.answers[i]===o?null:o;
     const li=document.getElementById('q-'+i);if(li)li.querySelectorAll('.opt').forEach((b,k)=>b.setAttribute('aria-checked',String(ex.answers[i]===k)));
     state.submitAsk=false;refreshOMR();break}
   case'ox':{if(!ex||ex.submitted)return;const i=+t.dataset.q,val=v==='1';ex.answers[i]=ex.answers[i]===val?null:val;
     const li=document.getElementById('q-'+i);if(li)li.querySelectorAll('.oxb').forEach(b=>{const on=ex.answers[i]===(b.dataset.v==='1');b.classList.toggle('on',on);b.setAttribute('aria-checked',String(on))});
     state.submitAsk=false;refreshOMR();break}
   case'ml':case'mr':{if(!ex||ex.submitted)return;const i=+t.dataset.q,k=+t.dataset.k,side=a==='ml'?'L':'R';
     if(mSel&&mSel.q===i&&mSel.side!==side){side==='L'?connect(i,k,mSel.k):connect(i,mSel.k,k);mSel=null}
     else if(mSel&&mSel.q===i&&mSel.side===side&&mSel.k===k)mSel=null;
     else mSel={q:i,side,k};
     refreshQ(i);document.querySelector(`#q-${i} [data-act="${a}"][data-k="${k}"]`)?.focus({preventScroll:true});state.submitAsk=false;refreshOMR();break}
   case'mclear':{const i=+t.dataset.q;ex.answers[i]={};mSel=null;refreshQ(i);refreshOMR();break}
   case'ovr':{const i=+t.dataset.q;ex.ovr[i]=!ex.ovr[i];const y=window.scrollY;render();window.scrollTo(0,y);recordHistory(ex);break}
   case'jump':{const i=t.dataset.q;const el=document.getElementById('ta-'+i)||document.getElementById('fi-'+i)||document.getElementById('mt-'+i)||document.getElementById('q-'+i);
     if(el){el.scrollIntoView({block:'center',behavior:'smooth'});if(el.focus&&(el.tagName==='TEXTAREA'||el.tagName==='INPUT'))el.focus({preventScroll:true})}break}
   case'submit':state.submitAsk=true;{const f=document.getElementById('omr-foot');if(f){f.innerHTML=footHTML(ex);if(window.innerWidth<=900)f.scrollIntoView({block:'center',behavior:'smooth'})}}break;
   case'submit-no':state.submitAsk=false;refreshOMR();break;
   case'submit-yes':submitExam();break;
   case'stop':genCtl&&genCtl.abort();break;
   case'stopgrade':gradeCtl&&gradeCtl.abort();break;
   case'retry':startExam('ai');break;
   case'tobank':startExam('bank');break;
   case'quit':state.quitAsk=true;renderExam();break;
   case'quit-no':state.quitAsk=false;renderExam();break;
   case'quit-yes':genCtl&&genCtl.abort();state.exam=null;state.view='setup';state.quitAsk=false;render();break;
   case'home':gradeCtl&&gradeCtl.abort();state.exam=null;state.view='setup';render();window.scrollTo(0,0);break;
   case'again':startExam(ex.mode==='retry'?'bank':ex.mode);break;
   case'retrywrong':{const qs=ex.questions.filter((q,i)=>AUTO(q.type)&&gradeQ(q,i,ex)<q.pts-1e-9).map(q=>{const c=Object.assign({},q);if(c.type==='match')c.rOrder=shuffle(c.left.map((x,k)=>k));return c});
     state.exam=newExam({units:ex.units,diff:ex.diff,count:qs.length,types:[...new Set(qs.map(q=>q.type))],mode:'retry',questions:qs,start:Date.now()});state.submitAsk=false;mSel=null;render();window.scrollTo(0,0);break}
  }
});
document.addEventListener('change',e=>{
  const t=e.target;const a=t.dataset&&t.dataset.act;if(!a)return;
  if(a==='unit'){const v=t.dataset.v;if(t.checked){if(!state.sel.includes(v))state.sel.push(v)}else state.sel=state.sel.filter(x=>x!==v);savePrefs();render();document.getElementById('u-'+v)?.focus()}
  if(a==='type'){const v=t.dataset.v;if(t.checked){if(!state.types.includes(v))state.types.push(v)}else state.types=state.types.filter(x=>x!==v);savePrefs();render();document.getElementById('t-'+v)?.focus()}
  if(a==='rub'){const ex=state.exam;const i=+t.dataset.q,k=+t.dataset.k;const s=new Set(ex.met[i]||[]);t.checked?s.add(k):s.delete(k);ex.met[i]=[...s].sort();
    const y=window.scrollY;render();window.scrollTo(0,y);document.getElementById(`rb-${i}-${k}`)?.focus({preventScroll:true});recordHistory(ex)}
});
document.addEventListener('input',e=>{
  const t=e.target;const act=t.dataset&&t.dataset.act;if(act!=='write'&&act!=='fill')return;
  const ex=state.exam;if(!ex||ex.submitted)return;const i=+t.dataset.q;ex.answers[i]=t.value;state.submitAsk=false;
  if(act==='write'){const c=document.getElementById('tc-'+i);if(c)c.textContent=t.value.length+'자'}
  const w=document.querySelector(`.wchip[data-q="${i}"]`);if(w)w.classList.toggle('f',!!t.value.trim());
  updateCounts();
});
document.addEventListener('keydown',e=>{if(e.key==='Enter'&&e.target.dataset&&e.target.dataset.act==='fill'){e.preventDefault();const all=[...document.querySelectorAll('.fillin,.ta')];const k=all.indexOf(e.target);if(all[k+1])all[k+1].focus()}});

/* hot update: keep an exam in progress */
function boot(data){
  if(data&&data.state){try{Object.assign(state,data.state);if(state.exam){state.exam=newExam(state.exam);if(state.exam.generating){state.exam.generating=false;state.exam.genNote='페이지가 업데이트되어 출제가 멈췄어요.'}if(state.exam.grading==='busy')state.exam.grading='self'}}catch(e){}}
  render();
}
try{window.claude?.hot?.snapshot?.(()=>({state:JSON.parse(JSON.stringify(state))}))}catch(e){}
window.claude?.hot?.ready?window.claude.hot.ready(boot):boot(window.claude?.hot?.data??{});
</script>

</body></html>
